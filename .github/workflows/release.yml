# Builds and publishes the desktop app installers whenever a version tag is
# pushed. Releases are published to a separate public repo
# (Michaljapko/riff-quest-releases, see electron-builder.yml `publish`) because
# this source repo is private and private-repo release assets aren't publicly
# downloadable — electron-updater on users' machines needs public access.
#
# Windows, Linux and macOS build in parallel, each on its native OS
# (electron-builder native modules — audify's ASIO/WASAPI/ALSA/CoreAudio binary
# — can't be cross-built). The mac build is arm64-only (Apple Silicon) — the
# macos-latest runner is arm64 hardware, so `npm ci` there naturally installs
# audify's arm64 prebuilt binary matching electron-builder.yml's mac target;
# adding Intel/x64 would need a separate x64 runner (e.g. macos-13) since a
# native module built for one Mac arch can't load in a process of the other.
# The mac app is unsigned/ad-hoc (no Apple Developer certificate) — see the
# comments in electron-builder.yml's `mac:` block for the launch/signing and
# known mic-capture-regression caveats.
#
# Release flow: bump the version and tag it locally, then push the tag —
#   npm version patch   # or minor / major
#   git push --follow-tags
name: Release desktop app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: electron:release
          - os: ubuntu-latest
            script: electron:release:linux
          - os: macos-latest
            script: electron:release:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # --legacy-peer-deps: the repo has a latent peer-dep conflict
        # (@testing-library/react@13 wants React 18, project is on React 19)
        # that only npm ci on a clean install actually enforces.
        run: npm ci --legacy-peer-deps

      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
