# Desktop packaging (electron-builder). The desktop app is a thin shell: it
# loads https://riff.quest remotely (see electron/main.js START_URL), so the
# package ships only the Electron main-process files, the favicons referenced
# by main.js, and the native audio module — NOT the Next.js app or its deps.
appId: quest.riff.desktop
productName: riff.quest
copyright: © riff.quest

directories:
  buildResources: build-resources
  output: dist-electron

files:
  - electron/**/*
  # Rebuild reference for electron/nam/nam.wasm — not needed at runtime.
  - "!electron/nam/wrapper.cpp"
  - "!electron/nam/README.md"
  - public/favicon/**/*
  - package.json
  # Exclude the whole Next.js dependency tree, then whitelist the native audio
  # module (audify is N-API, the locally built binary works in Electron as-is)
  # and its tiny runtime deps.
  - "!node_modules/**/*"
  - node_modules/audify/index.js
  - node_modules/audify/package.json
  - node_modules/audify/build/Release/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
  # electron-updater + its runtime deps (nested fs-extra/semver live inside
  # node_modules/electron-updater/node_modules and are covered by the first line).
  - node_modules/electron-updater/**
  - node_modules/builder-util-runtime/**
  - node_modules/js-yaml/**
  - node_modules/argparse/**
  - node_modules/lazy-val/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/lodash.isequal/**
  - node_modules/tiny-typed-emitter/**
  - node_modules/debug/**
  - node_modules/ms/**
  - node_modules/sax/**
  - node_modules/graceful-fs/**
  - node_modules/jsonfile/**
  - node_modules/universalify/**

asar: true
asarUnpack:
  - "**/*.node"

# audify needs no rebuild (N-API); skip rebuilding the unrelated web deps.
npmRebuild: false
nodeGypRebuild: false

win:
  icon: build-resources/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  artifactName: riff.quest-Setup-${version}.${ext}
  shortcutName: riff.quest

mac:
  icon: build-resources/icon.png
  category: public.app-category.music
  # No Apple Developer certificate → unsigned, like the Windows NSIS build.
  # "-" = ad-hoc signing, NOT the same as leaving this unset: Apple Silicon's
  # kernel refuses to launch ANY arm64 binary with no signature at all (instant
  # SIGKILL, no Gatekeeper prompt to click through) — ad-hoc is the minimum
  # needed for it to even start. Unsigned/unnotarized still means Gatekeeper
  # blocks first launch on download; users need to right-click → Open (or
  # `xattr -cr riff.quest.app`) past it, same tradeoff as Windows SmartScreen.
  # KNOWN RISK: electron-builder had a regression (userland issue #9529, ad-hoc
  # signing since v26.0.13) where mic/camera capture silently returns empty
  # frames despite the permission prompt succeeding — test guitar input on the
  # first real build before shipping it; the fallback if it's still broken is
  # an `afterSign` hook re-running `codesign --force --deep --sign -`.
  identity: "-"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

linux:
  icon: build-resources/icon.png
  category: AudioVideo
  executableName: riff-quest
  # Electron reads `desktopName` (package.json) at runtime to set its window's
  # app_id/WM_CLASS. Without this, that falls back to the raw npm package name
  # ("cwiczymy_razem") while the generated .desktop file's StartupWMClass used
  # productName ("riff.quest") instead — the mismatch meant desktop environments
  # (GNOME/KDE/Cinnamon) couldn't associate the running window with its .desktop
  # entry, so the taskbar/dock fell back to showing the raw package name with a
  # generic icon. syncDesktopName makes electron-builder derive the installed
  # .desktop filename + StartupWMClass from desktopName, matching what Electron
  # itself reports at runtime. https://www.electron.build/linux#window-association-desktopname--syncdesktopname
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64

# Auto-update feed (electron-updater checks GitHub Releases of this repo).
# This is a separate, public repo — the source repo is private, and private-repo
# release assets aren't publicly downloadable, which would break auto-update for
# users. Publishing needs GH_TOKEN for that repo: `npx electron-builder --win -p always`.
publish:
  provider: github
  owner: Michaljapko
  repo: riff-quest-releases
  # electron-builder defaults to publishing as a draft (hidden until manually
  # published) — auto-update needs the release to be live immediately.
  releaseType: release
