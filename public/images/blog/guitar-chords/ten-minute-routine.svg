<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Ten-minute chord practice plan in four blocks</title><rect width="100%" height="100%" fill="#FAF9F5"/><text x="55" y="51.15" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#276955">RIFF QUEST  /  TODAY’S CHORD SESSION</text><text x="55" y="119.1" font-family="Arial,sans-serif" font-size="46" font-weight="700" text-anchor="start" fill="#192826">Two chords. Ten minutes.</text><text x="55" y="165.4" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#53645F">Example pair: Am + C · adjust the pace to your clean playing</text><line x1="55" y1="203" x2="1145" y2="203" stroke="#87938D" stroke-width="2"/><text x="55" y="249.5" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#276955">00–02</text><text x="245" y="238.8" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#192826">Check each chord</text><text x="245" y="277.55" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#53645F">Pick the strings separately. Fix muted or buzzing notes.</text><line x1="55" y1="316" x2="1145" y2="316" stroke="#87938D" stroke-width="2"/><text x="55" y="362.5" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#276955">02–05</text><text x="245" y="351.8" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#192826">Practice the change</text><text x="245" y="390.55" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#53645F">Keep index and middle down. Move the ring finger.</text><line x1="55" y1="429" x2="1145" y2="429" stroke="#87938D" stroke-width="2"/><text x="55" y="475.5" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#276955">05–08</text><text x="245" y="464.8" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#192826">Add a steady beat</text><text x="245" y="503.55" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#53645F">One downstroke per beat. Change every four beats.</text><line x1="55" y1="542" x2="1145" y2="542" stroke="#87938D" stroke-width="2"/><text x="55" y="588.5" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#276955">08–10</text><text x="245" y="577.8" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#192826">Play a short progression</text><text x="245" y="616.55" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#53645F">Repeat Am | C | Am | C. Listen for gaps at each change.</text><text x="55" y="708.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#53645F">After playing: save the session in Riff Quest. Keep a separate note of your clean-change result.</text></svg>