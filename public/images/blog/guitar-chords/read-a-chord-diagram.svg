<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img"><title>How to read an A minor chord diagram</title><rect width="100%" height="100%" fill="#FAF9F5"/><text x="55" y="51.15" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#276955">RIFF QUEST  /  READING THE DIAGRAM</text><text x="55" y="112.0" font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#192826">One diagram. Everything you need.</text><text x="283.25" y="204.2" font-family="Arial,sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="#192826">Am</text><text x="160.0" y="268.90000000000003" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#192826">x</text><text x="209.3" y="268.90000000000003" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#192826">o</text><text x="406.5" y="268.90000000000003" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#192826">o</text><line x1="160" y1="293.4" x2="406.5" y2="293.4" stroke="#192826" stroke-width="7"/><line x1="160" y1="363.0" x2="406.5" y2="363.0" stroke="#87938D" stroke-width="2"/><line x1="160" y1="432.59999999999997" x2="406.5" y2="432.59999999999997" stroke="#87938D" stroke-width="2"/><line x1="160" y1="502.19999999999993" x2="406.5" y2="502.19999999999993" stroke="#87938D" stroke-width="2"/><line x1="160" y1="571.8" x2="406.5" y2="571.8" stroke="#87938D" stroke-width="2"/><line x1="160.0" y1="293.4" x2="160.0" y2="571.8" stroke="#87938D" stroke-width="2"/><text x="160.0" y="616.5" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">E</text><line x1="209.3" y1="293.4" x2="209.3" y2="571.8" stroke="#87938D" stroke-width="2"/><text x="209.3" y="616.5" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">A</text><line x1="258.6" y1="293.4" x2="258.6" y2="571.8" stroke="#87938D" stroke-width="2"/><text x="258.6" y="616.5" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">D</text><circle cx="258.6" cy="397.79999999999995" r="21.75" fill="#276955"/><text x="250.10000000000002" y="408.79999999999995" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">2</text><line x1="307.9" y1="293.4" x2="307.9" y2="571.8" stroke="#87938D" stroke-width="2"/><text x="307.9" y="616.5" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">G</text><circle cx="307.9" cy="397.79999999999995" r="21.75" fill="#276955"/><text x="299.4" y="408.79999999999995" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">3</text><line x1="357.2" y1="293.4" x2="357.2" y2="571.8" stroke="#87938D" stroke-width="2"/><text x="357.2" y="616.5" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">B</text><circle cx="357.2" cy="328.2" r="21.75" fill="#276955"/><text x="348.7" y="339.2" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">1</text><line x1="406.5" y1="293.4" x2="406.5" y2="571.8" stroke="#87938D" stroke-width="2"/><text x="406.5" y="616.5" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">e</text><text x="283.25" y="664.35" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#53645F">x02210</text><text x="535" y="206.25" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192826">1. Read strings left to right</text><text x="535" y="244.85" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#53645F">Low E · A · D · G · B · high e</text><text x="535" y="296.25" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192826">2. Check the top symbols</text><text x="535" y="334.85" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#53645F">x: skip the string.  o: play it open.</text><text x="535" y="386.25" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192826">3. Put fingers in the marked frets</text><text x="535" y="424.85" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#53645F">Dots show fret positions; numbers identify fingers.</text><text x="535" y="476.25" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#192826">4. Start at the lowest playable string</text><text x="535" y="514.85" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#53645F">For Am, strum from the open A string.</text><text x="55" y="753.7" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#53645F">Fingering shown: index B1 · middle D2 · ring G2. Thick top line = nut.</text></svg>