      <div class="stepper-row">
        <button class="step-btn" type="button" data-step-target="practiceBreakBeats" data-step="-1">&minus;</button>
        <input id="practiceBreakBeats" type="number" min="1" max="64" step="1" value="4">
        <button class="step-btn" type="button" data-step-target="practiceBreakBeats" data-step="1">&plus;</button>
      </div>
    </div>
  </div>

<script>
// LOGIC-BEGIN
function clampBpm(bpm) {
  const n = Math.round(Number(bpm));
  if (Number.isNaN(n)) return 120;
  return Math.min(400, Math.max(20, n));
}

function clampBpmPercent(pct) {
  const n = Math.round(Number(pct));
  if (Number.isNaN(n)) return 100;
  return Math.min(150, Math.max(50, n));
}

function computeEffectiveBpm(bpm, percent) {
  return clampBpm(bpm * (percent / 100));
}

function beatIntervalSeconds(bpm) {
  return 60 / bpm;
}

// Slot levels. Ordered so cyclePatternLevel can step through them with modulo
// arithmetic, and so the gain table below can be indexed directly.
const LEVEL_MUTED = 0;
const LEVEL_QUIET = 1;
const LEVEL_NORMAL = 2;
const LEVEL_ACCENT = 3;
const LEVEL_COUNT = 4;

const PATTERN_MIN = 1;
const PATTERN_MAX = 64;

function patternSlotCount(beats, division) {
  return beats * division;
}

function patternSlotIndex(beat, slot, division) {
  return beat * division + slot;
}

// Vertical arrow-key movement in the wrapped grid. Beat blocks flow side by
// side and wrap, so "the block below" is beatsPerLine beats away, not one —
// the caller measures that count from the laid-out DOM and passes it in, which
// is what keeps this pure. Out-of-range targets return the index unchanged
// rather than clamping to the first or last slot: on the top and bottom lines
// the honest answer is "nothing above/below", and sliding sideways to an
// unrelated slot would move the user's edit target without them asking.
function patternVerticalNeighbor(index, division, beats, beatsPerLine, direction) {
  const perLine = Number.isFinite(beatsPerLine) && beatsPerLine >= 1
    ? Math.floor(beatsPerLine)
    : 1;
  const beat = Math.floor(index / division);
  const slot = index % division;
  const target = beat + (direction < 0 ? -perLine : perLine);
  if (target < 0 || target >= beats) return index;
  return patternSlotIndex(target, slot, division);
}

function clampPatternValue(value, fallback) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n)) return fallback;
  return Math.min(PATTERN_MAX, Math.max(PATTERN_MIN, n));
}

function clampPatternBeats(value) {
  return clampPatternValue(value, 4);
}

function clampPatternDivision(value) {
  return clampPatternValue(value, 1);
}

function slotIntervalSeconds(bpm, division) {
  return beatIntervalSeconds(bpm) / division;
}

// The three gain factors are exactly the ones the pre-pattern scheduler used
// (subdivision 0.4, unaccented beat 0.7, accent 1.0), so an equivalent pattern
// sounds identical to what the app produced before the editor existed.
function levelGainFactor(level) {
  const table = [0, 0.4, 0.7, 1.0];
  return table[level] === undefined ? table[LEVEL_NORMAL] : table[level];
}

function levelIsAccent(level) {
  return level === LEVEL_ACCENT;
}

function cyclePatternLevel(level, direction) {
  const current = Number.isInteger(level) ? level : LEVEL_NORMAL;
  const step = direction < 0 ? -1 : 1;
  return ((current + step) % LEVEL_COUNT + LEVEL_COUNT) % LEVEL_COUNT;
}

function patternLevelAt(pattern, beat, slot) {
  const levels = pattern && pattern.levels;
  const raw = levels ? levels[patternSlotIndex(beat, slot, pattern.division)] : undefined;
  return Number.isInteger(raw) ? raw : LEVEL_NORMAL;
}

// Each preset describes the rhythm of ONE beat and is repeated across every
// beat: `slots` has `division` entries, 1 for a slot that sounds and 0 for
// one that rests. `glyph` is the note value the division represents and
// prefixes the option text in the preset <select>. Four presets rest on
// their own first slot; those bars carry no accent anywhere, which is the
// point of practising them — see the design spec.
const PATTERN_PRESETS = [
  { name: 'quarter',                    division: 1, glyph: '♩',       label: 'Quarter',              slots: [1] },
  { name: 'eighths',                    division: 2, glyph: '♫',       label: 'Eighths',              slots: [1, 1] },
  { name: 'offbeat-eighths',            division: 2, glyph: '♫',       label: 'Offbeat eighths',      slots: [0, 1] },
  { name: 'triplets',                   division: 3, glyph: '♪³', label: 'Triplet',              slots: [1, 1, 1] },
  { name: 'triplet-first-two',          division: 3, glyph: '♪³', label: 'Triplet, first two',   slots: [1, 1, 0] },
  { name: 'triplet-outer',              division: 3, glyph: '♪³', label: 'Triplet, outer two',   slots: [1, 0, 1] },
  { name: 'triplet-last-two',           division: 3, glyph: '♪³', label: 'Triplet, last two',    slots: [0, 1, 1] },
  { name: 'triplet-middle',             division: 3, glyph: '♪³', label: 'Triplet, middle only', slots: [0, 1, 0] },
  { name: 'sixteenths',                 division: 4, glyph: '♬',       label: 'Sixteenths',           slots: [1, 1, 1, 1] },
  { name: 'offbeat-sixteenths',         division: 4, glyph: '♬',       label: 'Sixteenth offbeats',   slots: [0, 1, 0, 1] },
  { name: 'gallop',                     division: 4, glyph: '♬',       label: 'Gallop',               slots: [1, 1, 1, 0] },
  { name: 'reverse-gallop',             division: 4, glyph: '♬',       label: 'Reverse gallop',       slots: [1, 0, 1, 1] },
  { name: 'sixteenth-eighth-sixteenth', division: 4, glyph: '♬',       label: '16th-8th-16th',        slots: [1, 1, 0, 1] },
  { name: 'dotted-eighth-sixteenth',    division: 4, glyph: '♬',       label: 'Dotted eighth + 16th', slots: [1, 0, 0, 1] },
  { name: 'sixteenth-dotted-eighth',    division: 4, glyph: '♬',       label: '16th + dotted eighth', slots: [1, 1, 0, 0] },
];

function presetByName(name) {
  return PATTERN_PRESETS.find((entry) => entry.name === name) || null;
}

function defaultLevelForSlot(beat, slot) {
  if (slot !== 0) return LEVEL_QUIET;
  return beat === 0 ? LEVEL_ACCENT : LEVEL_NORMAL;
}

// Division comes from the template's own length, so a roster entry cannot
// disagree with itself about how many slots a beat has.
function buildPresetLevels(beats, preset) {
  const slots = preset.slots;
  const levels = [];
  for (let beat = 0; beat < beats; beat++) {
    for (let slot = 0; slot < slots.length; slot++) {
      levels.push(slots[slot] ? defaultLevelForSlot(beat, slot) : LEVEL_MUTED);
    }
  }
  return levels;
}

// Names a pattern by what its levels actually are rather than by its
// division: seven presets share division 4, and changing the division
// preserves the old levels instead of rebuilding them, so only a full
// comparison can say whether the grid still matches the preset it came
// from. Called on user input and on load, never from the scheduler or the
// playhead frame loop, so building up to fifteen candidates is not on a
// timing path.
function presetForPattern(pattern) {
  const source = pattern && typeof pattern === 'object' ? pattern : {};
  const levels = Array.isArray(source.levels) ? source.levels : [];
  for (let i = 0; i < PATTERN_PRESETS.length; i++) {
    const preset = PATTERN_PRESETS[i];
    if (preset.division !== source.division) continue;
    const candidate = buildPresetLevels(source.beats, preset);
    if (candidate.length !== levels.length) continue;
    let same = true;
    for (let j = 0; j < candidate.length; j++) {
      if (candidate[j] !== levels[j]) { same = false; break; }
    }
    if (same) return preset.name;
  }
  return 'custom';
}

// Preserves every level by its (beat, slot) position rather than by flat index,
// so changing division does not shear the pattern sideways. Positions that did
// not exist before get the same defaults a preset would give them.
function resizePatternLevels(levels, oldBeats, oldDivision, newBeats, newDivision) {
  const result = [];
  for (let beat = 0; beat < newBeats; beat++) {
    for (let slot = 0; slot < newDivision; slot++) {
      const survives = beat < oldBeats && slot < oldDivision;
      const previous = survives && levels
        ? levels[patternSlotIndex(beat, slot, oldDivision)]
        : undefined;
      result.push(Number.isInteger(previous) ? previous : defaultLevelForSlot(beat, slot));
    }
  }
  return result;
}

function parseSavedSettings(json) {
  try {
    const parsed = JSON.parse(json);
    return parsed && typeof parsed === 'object' ? parsed : null;
  } catch (e) {
    return null;
  }
}

// Guards against a hand-edited or truncated save: clamps both dimensions, then
// forces the level array to exactly beats * division entries.
function normalizePattern(pattern) {
  const source = pattern && typeof pattern === 'object' ? pattern : {};
  const beats = clampPatternBeats(source.beats);
  const division = clampPatternDivision(source.division);
  const levels = resizePatternLevels(
    Array.isArray(source.levels) ? source.levels : null,
    beats, division, beats, division
  );
  // A saved name from an older roster ('none', in particular) would reach
  // select.value and match no <option>, leaving the dropdown blank. Anything
  // not in today's roster is re-derived from the levels instead.
  const saved = source.preset;
  const known = saved === 'custom' || presetByName(saved) !== null;
  const preset = known
    ? saved
    : presetForPattern({ beats: beats, division: division, levels: levels });
  return { beats: beats, division: division, preset: preset, levels: levels };
}

// The four values the retired Subdivision <select> could hold. That control
// no longer exists, so this map must never gain entries. It is deliberately
// separate from PATTERN_PRESETS: migration used to read the roster, which
// meant renaming a preset silently downgraded an old save's division.
const LEGACY_SUBDIVISION_DIVISIONS = Object.freeze({
  none: 1, eighths: 2, triplets: 3, sixteenths: 4,
});

// Runs once per load. A save written before the pattern editor existed has its
// meter and accents rebuilt from the old fields rather than being reset to the
// default — Metronome is the source, because three per-mode patterns are
// collapsing into one and Metronome is the tab a user is likeliest to have set.
function migrateLegacyPattern(parsed, defaults) {
  const fallback = normalizePattern(defaults.topBar.pattern);
  if (!parsed || typeof parsed !== 'object') return fallback;
  const topBar = parsed.topBar;
  if (!topBar || typeof topBar !== 'object') return fallback;
  if (topBar.pattern && typeof topBar.pattern === 'object') return normalizePattern(topBar.pattern);

  const division = LEGACY_SUBDIVISION_DIVISIONS[topBar.subdivision] || 1;
  const legacy = parsed.metronome && typeof parsed.metronome === 'object' ? parsed.metronome : {};
  const beats = clampPatternBeats(legacy.timeSigNum);
  const accents = Array.isArray(legacy.accentPattern) ? legacy.accentPattern : [];
  const levels = [];
  for (let beat = 0; beat < beats; beat++) {
    for (let slot = 0; slot < division; slot++) {
      if (slot !== 0) levels.push(LEVEL_QUIET);
      else levels.push(accents[beat] ? LEVEL_ACCENT : LEVEL_NORMAL);
    }
  }
  const migrated = { beats: beats, division: division, preset: 'custom', levels: levels };
  migrated.preset = presetForPattern(migrated);
  return migrated;
}

// Scans by time rather than by ring position, so a wrapped buffer needs no
// bookkeeping. Rejecting stale runId/generation here is what stops a highlight
// surviving a stop-then-start or a mid-playback grid resize.
function findPlayheadEntry(entries, now, runId, generation) {
  if (!Array.isArray(entries)) return null;
  let best = null;
  for (let i = 0; i < entries.length; i++) {
    const candidate = entries[i];
    if (!candidate) continue;
    if (candidate.runId !== runId || candidate.generation !== generation) continue;
    if (candidate.time > now) continue;
    if (best === null || candidate.time > best.time) best = candidate;
  }
  return best;
}

function bpmFromTapTimestamps(timestamps) {
  if (!Array.isArray(timestamps) || timestamps.length < 2) return null;
  const diffs = [];
  for (let i = 1; i < timestamps.length; i++) {
    const diff = timestamps[i] - timestamps[i - 1];
    if (diff > 0 && diff <= 2000) diffs.push(diff);
  }
  if (diffs.length === 0) return null;
  const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  return clampBpm(60000 / avg);
}

function inferRampDirection(startBpm, stopBpm) {
  if (startBpm === stopBpm) return null;
  return startBpm < stopBpm ? 'up' : 'down';
}

// One beat of a running ramp. Direction is DERIVED from where the tempo sits
// against the live target rather than stored on the runtime: the target can
// move mid-run — the Up/Down keys point at Stop BPM in this mode precisely so
// it can — and a ramp that stored "arrived, no direction" could never set off
// again when it did. Returns a fresh runtime; the caller owns the assignment.
function advanceRampRuntime(runtime, ramp, beatsPerStep) {
  const beatsIntoStep = runtime.beatsIntoStep + 1;
  const direction = inferRampDirection(runtime.currentBpm, ramp.stopBpm);
  if (direction === null || beatsIntoStep < beatsPerStep) {
    return { currentBpm: runtime.currentBpm, direction: direction, beatsIntoStep: beatsIntoStep };
  }
  return {
    currentBpm: computeNextRampBpm(
      runtime.currentBpm, direction, ramp.scaleMode, ramp.scaleAmount, ramp.stopBpm
    ),
    direction: direction,
    beatsIntoStep: 0,
  };
}

function computeNextRampBpm(currentBpm, direction, scaleMode, scaleAmount, stopBpm) {
  if (direction === null) return stopBpm;
  const delta = scaleMode === 'percent' ? currentBpm * (scaleAmount / 100) : scaleAmount;
  let next = direction === 'up' ? currentBpm + delta : currentBpm - delta;
  next = direction === 'up' ? Math.min(next, stopBpm) : Math.max(next, stopBpm);
  let rounded = Math.round(next);
  // A tiny step (e.g. 2% of a low BPM) can round back to currentBpm, stalling the
  // ramp forever since beatsIntoStep resets without the tempo ever changing.
  // Force at least a 1-BPM move toward the target, still clamped at stopBpm.
  if (direction === 'up' && rounded <= currentBpm) {
    rounded = Math.min(currentBpm + 1, stopBpm);
  } else if (direction === 'down' && rounded >= currentBpm) {
    rounded = Math.max(currentBpm - 1, stopBpm);
  }
  return rounded;
}

function barsToBeats(bars, timeSigNumerator) {
  return bars * timeSigNumerator;
}

function computeSlowBpm(baseBpm, deltaPercent) {
  return clampBpm(baseBpm * (1 - deltaPercent / 100));
}

function buildPracticePhaseSequence(beatsPerPhase, breakBeats) {
  const seq = [];
  for (let i = 0; i < beatsPerPhase; i++) seq.push('slow');
  for (let i = 0; i < breakBeats; i++) seq.push('break');
  for (let i = 0; i < beatsPerPhase; i++) seq.push('fast');
  for (let i = 0; i < breakBeats; i++) seq.push('break');
  return seq;
}

function bpmForPhase(phase, baseBpm, slowBpm) {
  return phase === 'fast' ? baseBpm : slowBpm;
}

function serializeSettings(state) {
  return JSON.stringify(state);
}

function deserializeSettings(json, defaults) {
  const merged = JSON.parse(JSON.stringify(defaults));
  let parsed;
  try {
    parsed = JSON.parse(json);
  } catch (e) {
    return merged;
  }
  if (!parsed || typeof parsed !== 'object') return merged;
  for (const section of Object.keys(defaults)) {
    if (parsed[section] && typeof parsed[section] === 'object') {
      Object.assign(merged[section], parsed[section]);
    }
  }
  return merged;
}

function clampPositiveInt(value, fallback) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n) || n < 1) return fallback;
  return n;
}

function wasValueClamped(rawValue, clampedValue, decimals) {
  const n = Number(rawValue);
  if (!Number.isFinite(n)) return true;
  const scale = Math.pow(10, decimals || 0);
  const rounded = Math.round(n * scale) / scale;
  return rounded !== clampedValue;
}

function practiceSegmentIndex(sequenceIndex, beatsPerPhase, breakBeats) {
  if (sequenceIndex < beatsPerPhase) return 0;
  if (sequenceIndex < beatsPerPhase + breakBeats) return 1;
  if (sequenceIndex < beatsPerPhase + breakBeats + beatsPerPhase) return 2;
  return 3;
}

function practicePhasePosition(sequenceIndex, beatsPerPhase, breakBeats) {
  if (sequenceIndex < beatsPerPhase) return sequenceIndex;
  if (sequenceIndex < beatsPerPhase + breakBeats) return sequenceIndex - beatsPerPhase;
  if (sequenceIndex < beatsPerPhase + breakBeats + beatsPerPhase) return sequenceIndex - (beatsPerPhase + breakBeats);
  return sequenceIndex - (beatsPerPhase + breakBeats + beatsPerPhase);
}

function buildQuickSelectValues(presets, currentValue) {
  const values = presets.includes(currentValue) ? presets.slice() : presets.concat([currentValue]);
  return values.sort((a, b) => a - b);
}

function resolveTheme(saved, validThemes, fallback) {
  if (!Array.isArray(validThemes)) return fallback;
  return validThemes.includes(saved) ? saved : fallback;
}
// LOGIC-END
</script>
<script>
const DEFAULT_STATE = {
  topBar: {
    soundStyle: 'click', volume: 80, activeTab: 'metronome', theme: 'classic',
    // LEVEL_* come from the LOGIC <script>, which runs before this block, so
    // the seed states its levels by name like every other level reference.
    pattern: {
      beats: 4, division: 1, preset: 'quarter',
      levels: [LEVEL_ACCENT, LEVEL_NORMAL, LEVEL_NORMAL, LEVEL_NORMAL],
    },
    patternEditorOpen: true,
  },
  metronome: { bpm: 120, percent: 100 },
  ramp: { startBpm: 80, stopBpm: 140, scaleMode: 'percent', scaleAmount: 2, stepBars: 4 },
  practice: { baseBpm: 120, deltaPercent: 50, barsPerPhase: 1, breakBeats: 4 },
};

const STORAGE_KEY = 'guitarMetronomeSettings';

// Every localStorage access goes through these two, because touching it at all
// throws in a browser with site data blocked and in private browsing once the
// quota is zero. The read is the dangerous one: it runs during initial
// evaluation, so an uncaught throw there aborts the rest of this script and the
// page renders with nothing bound — controls dead, pattern grid empty — rather
// than merely forgetting its settings. Neither failure is something the user
// can act on, so both degrade in silence: the app opens on defaults and plays
// normally, it just does not remember. A warning would sit next to the readout
// that principle 1 of the design brief wants kept clear.
// tests/resilience.test.js keeps bare calls from creeping back in.
function readSavedSettings() {
  try {
    return localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return null;
  }
}

function writeSavedSettings(json) {
  try {
    localStorage.setItem(STORAGE_KEY, json);
  } catch (e) {
    // Nothing to do and nothing to say — see above.
  }
}

// null is the same input a first run gives, and every consumer below already
// treats it as "no save": deserializeSettings returns the defaults untouched,
// and parseSavedSettings/migrateLegacyPattern fall back to the default pattern.
const savedSettingsJson = readSavedSettings();
let state = deserializeSettings(savedSettingsJson, DEFAULT_STATE);
// deserializeSettings merges section-wise, so a pre-editor save would silently
// receive the default pattern and lose its meter and accents. Rebuild it from
// the raw blob instead.
state.topBar.pattern = migrateLegacyPattern(parseSavedSettings(savedSettingsJson), DEFAULT_STATE);

function persistState() {
  writeSavedSettings(serializeSettings(state));
}

const CLAMP_FLASH_MS = 500;

function flashClamped(inputEl) {
  inputEl.classList.add('clamped');
  clearTimeout(inputEl._clampFlashTimer);
  inputEl._clampFlashTimer = setTimeout(() => inputEl.classList.remove('clamped'), CLAMP_FLASH_MS);
}

function refreshAllInputsFromState() {
  document.getElementById('soundStyle').value = state.topBar.soundStyle;
  document.getElementById('volume').value = state.topBar.volume;
  document.getElementById('volumeValue').textContent = state.topBar.volume + '%';
  document.getElementById('patternPreset').value = state.topBar.pattern.preset;
  document.getElementById('patternBeats').value = state.topBar.pattern.beats;
  document.getElementById('patternDivision').value = state.topBar.pattern.division;
  applyPatternEditorOpen();
  renderPatternGrid();

  document.getElementById('metronomeBpm').value = state.metronome.bpm;
  document.getElementById('metronomeBpmRange').value = state.metronome.bpm;
  document.getElementById('metronomePercent').value = state.metronome.percent;
  document.getElementById('metronomePercentRange').value = state.metronome.percent;

  document.getElementById('rampStartBpm').value = state.ramp.startBpm;
  document.getElementById('rampStartBpmRange').value = state.ramp.startBpm;
  document.getElementById('rampStopBpm').value = state.ramp.stopBpm;
  document.getElementById('rampStopBpmRange').value = state.ramp.stopBpm;
  document.getElementById('rampScaleMode').value = state.ramp.scaleMode;
  document.getElementById('rampScaleAmount').value = state.ramp.scaleAmount;
  document.getElementById('rampStepBars').value = state.ramp.stepBars;

  document.getElementById('practiceBaseBpm').value = state.practice.baseBpm;
  document.getElementById('practiceBaseBpmRange').value = state.practice.baseBpm;
  document.getElementById('practiceDeltaPercent').value = state.practice.deltaPercent;
  document.getElementById('practiceDeltaPercentRange').value = state.practice.deltaPercent;
  document.getElementById('practiceBarsPerPhase').value = state.practice.barsPerPhase;
  document.getElementById('practiceBreakBeats').value = state.practice.breakBeats;

  const themeValues = THEMES.map((t) => t.value);
  state.topBar.theme = resolveTheme(state.topBar.theme, themeValues, 'classic');
  applyTheme(state.topBar.theme);
  document.getElementById('themeSelect').value = state.topBar.theme;

  const validTabs = ['metronome', 'ramp', 'practice'];
  const activeTab = validTabs.includes(state.topBar.activeTab) ? state.topBar.activeTab : 'metronome';
  switchTab(activeTab);
}

const THEMES = [
  { value: 'classic',      label: 'Classic' },
  { value: 'pulse-engine', label: 'Pulse Engine' },
  { value: 'kinetic-type', label: 'Kinetic Type' },
  { value: 'pulse-field',  label: 'Pulse Field' },
  { value: 'grid-console', label: 'Grid Console' },
];

function applyTheme(name) {
  document.documentElement.dataset.theme = name;
}

function populateThemeSelect() {
  const select = document.getElementById('themeSelect');
  select.innerHTML = '';
  THEMES.forEach((theme) => {
    const option = document.createElement('option');
    option.value = theme.value;
    option.textContent = theme.label;
    select.appendChild(option);
  });
}

function bindTopBar() {
  const soundStyle = document.getElementById('soundStyle');
  const volume = document.getElementById('volume');
  const themeSelect = document.getElementById('themeSelect');

  soundStyle.addEventListener('change', () => {
    state.topBar.soundStyle = soundStyle.value;
    persistState();
  });
  volume.addEventListener('input', () => {
    state.topBar.volume = Number(volume.value);
    document.getElementById('volumeValue').textContent = state.topBar.volume + '%';
    persistState();
  });
  themeSelect.addEventListener('change', () => {
    state.topBar.theme = themeSelect.value;
    applyTheme(state.topBar.theme);
    persistState();
  });
}

populateThemeSelect();
bindTopBar();

let audioCtx = null;
let isPlaying = false;
let nextNoteTime = 0;
let schedulerTimerId = null;
let beatIndexInBar = 0;

const LOOKAHEAD_MS = 25;
const SCHEDULE_AHEAD_SEC = 0.1;

// Returns null rather than throwing when Web Audio is unavailable — an
// embedded or locked-down context can refuse the constructor outright. Every
// other caller sits on the playback path and is only reachable once
// startPlayback has already accepted a non-null context, so the null check
// lives there and there alone.
function ensureAudioContext() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try {
      audioCtx = new Ctor();
    } catch (e) {
      return null;
    }
  }
  return audioCtx;
}

// The only message this app ever shows. It is inline under the transport rather
// than a banner or a dialog, because the brief's third principle asks new UI to
// stay out of the way — and it clears itself the moment a start succeeds, so a
// one-off block never lingers as permanent chrome.
function showTransportNote(text) {
  const note = document.getElementById('transportNote');
  note.textContent = text;
  note.hidden = false;
}

function clearTransportNote() {
  const note = document.getElementById('transportNote');
  note.hidden = true;
  note.textContent = '';
}

function soundFrequency(style, accent) {
  const table = {
    click: accent ? 1500 : 1000,
    beep: accent ? 1800 : 1200,
    wood: accent ? 900 : 500,
  };
  return table[style] || table.click;
}

function scheduleClick(time, level) {
  const ctx = ensureAudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = state.topBar.soundStyle === 'wood' ? 'triangle' : 'sine';
  osc.frequency.value = soundFrequency(state.topBar.soundStyle, levelIsAccent(level));
  const vol = (state.topBar.volume / 100) * levelGainFactor(level);
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  osc.start(time);
  osc.stop(time + 0.06);
}

function flashBeatIndicator(beatIndex, accent) {
  triggerBeatFlash(accent);
  const dots = document.getElementById('beatIndicator').children;
  const dot = dots[beatIndex];
  if (!dot) return;
  dot.classList.add('pulse');
  dot.classList.toggle('accent', accent);
  dot.addEventListener('transitionend', () => dot.classList.remove('pulse'), { once: true });
}

function renderDotRow(count) {
  const container = document.getElementById('beatIndicator');
  container.setAttribute('aria-hidden', 'true');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    dot.className = 'beat-dot';
    container.appendChild(dot);
  }
  // Force a synchronous reflow so the freshly-created dots' resting style is
  // committed before scheduleBeat's immediately-following flashBeatIndicator()
  // call adds .pulse. Without this, a dot created and pulsed in the same tick
  // has no prior committed style to transition from, so no transition starts,
  // transitionend never fires, and the pulse class gets stuck forever on that
  // dot — which always happens to be index 0, the first beat of every segment
  // this function is called for.
  container.offsetHeight;
}

let rampRuntime = null;

let practiceRuntime = null;

// Bumped whenever beats or division changes, so playhead records scheduled
// against the previous grid are rejected rather than highlighting a slot index
// that now means something else. Read by the playhead frame loop.
let patternGeneration = 0;

// The playhead is the app's only per-SLOT visual feedback, and deliberately
// does not use the deferred-setTimeout pattern that per-beat feedback uses:
// at high divisions those callbacks queue rather than skip, and the highlight
// would drag behind the audio. This loop reads the audio clock each frame and
// renders only slots already in the past, so it can neither run early nor
// fall behind — it just shows fewer slots when there are more than frames.
const PLAYHEAD_RING_SIZE = 256;
let playheadRing = new Array(PLAYHEAD_RING_SIZE).fill(null);
let playheadWriteIndex = 0;
let playbackRunId = 0;
let playheadFrameId = null;
let playheadSlotIndex = -1;

function pushPlayheadEntry(time, slotIndex) {
  playheadRing[playheadWriteIndex] = {
    time: time,
    slotIndex: slotIndex,
    runId: playbackRunId,
    generation: patternGeneration,
  };
  playheadWriteIndex = (playheadWriteIndex + 1) % PLAYHEAD_RING_SIZE;
}

function clearPlayhead() {
  const grid = document.getElementById('patternGrid');
  const slot = grid.querySelector('.pattern-slot.playhead');
  if (slot) slot.classList.remove('playhead');
  const row = grid.querySelector('.pattern-row.playhead-row');
  if (row) row.classList.remove('playhead-row');
  playheadSlotIndex = -1;
}

function playheadFrame() {
  if (!isPlaying) return;
  const ctx = ensureAudioContext();
  const entry = findPlayheadEntry(playheadRing, ctx.currentTime, playbackRunId, patternGeneration);
  // A slotIndex of -1 is pushed for practice-break beats and means "no slot is
  // sounding"; clearPlayhead leaves playheadSlotIndex at -1, so it settles
  // after one frame rather than clearing repeatedly.
  if (entry && entry.slotIndex !== playheadSlotIndex) {
    clearPlayhead();
    const el = document.getElementById('patternGrid')
      .querySelector(`.pattern-slot[data-index="${entry.slotIndex}"]`);
    if (el) {
      el.classList.add('playhead');
      const row = el.closest('.pattern-row');
      if (row) row.classList.add('playhead-row');
    }
    // Set unconditionally, after clearPlayhead reset it: a lookup that misses
    // (a stale index, or the -1 break sentinel) must still settle, or the
    // inequality above stays true and every frame re-runs the querySelector
    // until the record changes.
    playheadSlotIndex = entry.slotIndex;
  }
  playheadFrameId = requestAnimationFrame(playheadFrame);
}

function startPlayhead() {
  playbackRunId++;
  playheadRing.fill(null);
  playheadWriteIndex = 0;
  playheadSlotIndex = -1;
  playheadFrameId = requestAnimationFrame(playheadFrame);
}

function stopPlayhead() {
  if (playheadFrameId !== null) cancelAnimationFrame(playheadFrameId);
  playheadFrameId = null;
  clearPlayhead();
}

function currentModeBpm() {
  if (state.topBar.activeTab === 'ramp') {
    return rampRuntime.currentBpm;
  }
  if (state.topBar.activeTab === 'practice') {
    const slowBpm = computeSlowBpm(state.practice.baseBpm, state.practice.deltaPercent);
    return bpmForPhase(practiceRuntime.sequence[practiceRuntime.index], state.practice.baseBpm, slowBpm);
  }
  return computeEffectiveBpm(state.metronome.bpm, state.metronome.percent);
}

function updateRampReadout(explicitDisplay) {
  const display = explicitDisplay !== undefined
    ? explicitDisplay
    : (rampRuntime ? { currentBpm: rampRuntime.currentBpm, direction: rampRuntime.direction } : null);
  if (!display) return;
  document.getElementById('rampReadout').textContent =
    `Current: ${display.currentBpm} BPM` + (display.direction === null ? ' (holding at target)' : '');
}

const PHASE_SEGMENT_LABELS = ['SLOW', 'BREAK', 'FAST', 'BREAK'];
let phaseSegmentSpans = null;

function buildPhaseSegmentSpans() {
  const el = document.getElementById('practiceReadout');
  el.innerHTML = '';
  phaseSegmentSpans = PHASE_SEGMENT_LABELS.map((label, i) => {
    if (i > 0) el.appendChild(document.createTextNode(' – '));
    const span = document.createElement('span');
    span.className = 'phase-segment';
    span.textContent = label;
    el.appendChild(span);
    return span;
  });
}

function updatePracticeReadout(explicitSegment) {
  if (!phaseSegmentSpans) buildPhaseSegmentSpans();
  const activeSegment = explicitSegment !== undefined
    ? explicitSegment
    : (isPlaying && practiceRuntime)
      ? practiceSegmentIndex(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
      : 0;
  phaseSegmentSpans.forEach((span, i) => {
    span.classList.toggle('active', i === activeSegment);
  });
}

function updateHeroBpm(explicitBpm) {
  const el = document.getElementById('heroBpm');
  let bpm = explicitBpm;
  if (bpm === undefined) {
    if (state.topBar.activeTab === 'ramp') {
      bpm = (isPlaying && rampRuntime) ? rampRuntime.currentBpm : clampBpm(state.ramp.startBpm);
    } else if (state.topBar.activeTab === 'practice') {
      if (isPlaying && practiceRuntime) {
        const slowBpm = computeSlowBpm(state.practice.baseBpm, state.practice.deltaPercent);
        bpm = bpmForPhase(practiceRuntime.sequence[practiceRuntime.index], state.practice.baseBpm, slowBpm);
      } else {
        bpm = clampBpm(state.practice.baseBpm);
      }
    } else {
      bpm = computeEffectiveBpm(state.metronome.bpm, state.metronome.percent);
    }
  }
  el.textContent = bpm;
}

function advanceModeAfterBeat() {
  if (state.topBar.activeTab === 'ramp' && rampRuntime) {
    // Reassigning is safe: nothing identity-checks rampRuntime the way the
    // practice callback checks practiceRuntime — every reader takes fields off
    // whatever the variable currently points at.
    rampRuntime = advanceRampRuntime(
      rampRuntime, state.ramp, barsToBeats(state.ramp.stepBars, state.topBar.pattern.beats)
    );
  } else if (state.topBar.activeTab === 'practice' && practiceRuntime) {
    practiceRuntime.index = (practiceRuntime.index + 1) % practiceRuntime.sequence.length;
  }
}

function scheduleBeat(time) {
  const bpm = currentModeBpm();
  const beatIndex = beatIndexInBar;
  const scheduledTab = state.topBar.activeTab;
  const isPracticeMode = scheduledTab === 'practice' && practiceRuntime;
  const isPracticeBreak = isPracticeMode && practiceRuntime.sequence[practiceRuntime.index] === 'break';
  const pattern = state.topBar.pattern;
  const division = pattern.division;
  const slotInterval = slotIntervalSeconds(bpm, division);
  // Captured for the deferred per-beat callback below, alongside the other
  // capture-before-advance values.
  let beatLevel = LEVEL_NORMAL;
  for (let s = 0; s < division; s++) {
    // A practice break ignores the pattern entirely: one normal click on the
    // beat, nothing in between, so a break is audibly flat against a phase.
    const level = isPracticeBreak
      ? (s === 0 ? LEVEL_NORMAL : LEVEL_MUTED)
      : patternLevelAt(pattern, beatIndex, s);
    if (s === 0) beatLevel = level;
    // -1 during a break: the pattern is not playing, so no slot should light.
    pushPlayheadEntry(
      time + slotInterval * s,
      isPracticeBreak ? -1 : patternSlotIndex(beatIndex, s, division)
    );
    if (level === LEVEL_MUTED) continue;
    scheduleClick(time + slotInterval * s, level);
  }
  const accent = levelIsAccent(beatLevel);

  const rampDisplay = (state.topBar.activeTab === 'ramp' && rampRuntime)
    ? { currentBpm: rampRuntime.currentBpm, direction: rampRuntime.direction }
    : null;
  const practiceSegment = isPracticeMode
    ? practiceSegmentIndex(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
    : null;
  const dotIndex = isPracticeMode
    ? practicePhasePosition(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
    : beatIndex;
  const dotCount = isPracticeMode
    ? (isPracticeBreak ? practiceRuntime.breakBeats : practiceRuntime.beatsPerPhase)
    : null;
  const dotRuntime = isPracticeMode ? practiceRuntime : null;

  const ctx = ensureAudioContext();
  setTimeout(() => {
    if (!isPlaying || state.topBar.activeTab !== scheduledTab) return;
    if (dotCount !== null && practiceRuntime === dotRuntime
        && document.getElementById('beatIndicator').children.length !== dotCount) {
      renderDotRow(dotCount);
    }
    flashBeatIndicator(dotIndex, accent);
    updateHeroBpm(bpm);
    if (rampDisplay) updateRampReadout(rampDisplay);
    if (practiceSegment !== null) updatePracticeReadout(practiceSegment);
  }, Math.max(0, (time - ctx.currentTime) * 1000));

  // A practice break does not consume a bar position. The break already
  // refuses to read the pattern at all (see the slot loop above, which mutes
  // every slot but the beat and pushes -1 to the playhead), so letting its
  // beats advance this counter rotated the bar underneath the following phase
  // and started it mid-bar — with a 4-beat pattern and a 2-beat break, the
  // fast phase used to open on bar position 2. Freezing the counter across the
  // break resumes the next phase where the previous one ended, and since a
  // phase is always a whole number of bars (barsToBeats multiplies barsPerPhase
  // by pattern.beats), that is the top of the bar.
  if (!isPracticeBreak) beatIndexInBar = (beatIndexInBar + 1) % pattern.beats;
  advanceModeAfterBeat();
  nextNoteTime = time + beatIntervalSeconds(bpm);
}

function schedulerTick() {
  const ctx = ensureAudioContext();
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD_SEC) {
    scheduleBeat(nextNoteTime);
  }
  schedulerTimerId = setTimeout(schedulerTick, LOOKAHEAD_MS);
}

function setTransportState(playing) {
  const btn = document.getElementById('startStop');
  btn.textContent = playing ? 'Stop' : 'Start';
  btn.classList.toggle('is-playing', playing);
  document.body.classList.toggle('playing', playing);
}

function triggerBeatFlash(accent) {
  const flash = document.getElementById('beatFlash');
  if (!flash) return;
  flash.classList.remove('beat', 'beat-accent');
  void flash.offsetWidth;
  flash.classList.add('beat');
  if (accent) flash.classList.add('beat-accent');
}

const AUDIO_BLOCKED_NOTE = 'Audio didn’t start. Press Start again — if it stays silent, reload the page.';

function startPlayback() {
  if (isPlaying) return;
  const ctx = ensureAudioContext();
  // Bail before touching any transport state: a run that cannot make sound must
  // not leave the button reading "Stop" over silence.
  if (!ctx) {
    showTransportNote(AUDIO_BLOCKED_NOTE);
    return;
  }
  clearTransportNote();
  if (ctx.state === 'suspended') {
    const resuming = ctx.resume();
    // resume() rejects asynchronously, well after the lines below have started
    // the run, so this path has to unwind a transport that is already playing.
    if (resuming && typeof resuming.catch === 'function') {
      resuming.catch(() => {
        stopPlayback();
        showTransportNote(AUDIO_BLOCKED_NOTE);
      });
    }
  }
  isPlaying = true;
  beatIndexInBar = 0;
  startPlayhead();
  nextNoteTime = ctx.currentTime + 0.05;
  if (state.topBar.activeTab === 'ramp') {
    rampRuntime = {
      currentBpm: clampBpm(state.ramp.startBpm),
      direction: inferRampDirection(state.ramp.startBpm, state.ramp.stopBpm),
      beatsIntoStep: 0,
    };
    updateRampReadout();
  }
  if (state.topBar.activeTab === 'practice') {
    const beatsPerPhase = barsToBeats(state.practice.barsPerPhase, state.topBar.pattern.beats);
    practiceRuntime = {
      sequence: buildPracticePhaseSequence(beatsPerPhase, state.practice.breakBeats),
      beatsPerPhase: beatsPerPhase,
      breakBeats: state.practice.breakBeats,
      index: 0,
    };
    renderDotRow(practiceRuntime.beatsPerPhase);
    updatePracticeReadout();
  }
  schedulerTick();
  setTransportState(true);
}

function stopPlayback() {
  if (!isPlaying) return;
  isPlaying = false;
  clearTimeout(schedulerTimerId);
  stopPlayhead();
  setTransportState(false);
  updatePracticeReadout();
  renderDotRow(state.topBar.pattern.beats);
  const flash = document.getElementById('beatFlash');
  if (flash) flash.classList.remove('beat', 'beat-accent');
}

document.getElementById('startStop').addEventListener('click', () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

// Filled by each bind*Tab(). The Up/Down keys reuse the very setters the ± and
// ±5 buttons use, because clamping, the out-of-range flash, the paired range
// slider and the hero readout all live inside them — but those setters are
// closures, so each tab hands its main tempo field over here. Same
// `{ input, set }` shape the stepper maps already use.
const mainBpmField = {};

// True when a bare keypress belongs to the page rather than to whatever holds
// focus. Space and the tempo keys share it so they can never disagree about who
// owns a keystroke. Three contexts take precedence: a focused field, where
// Space types and the arrows step natively; an open quick-select listbox, which
// owns the arrows for its options; and the pattern editor, whose slots are
// <button>s the tag check below cannot see and whose grid handler owns both
// Space and the arrows for moving between slots.
function globalShortcutAllowed() {
  if (openQuickSelectPopup) return false;
  const el = document.activeElement;
  if (!el) return true;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return false;
  return !el.closest('#patternEditor');
}

document.addEventListener('keydown', (e) => {
  // Never hijack a browser or OS chord.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!globalShortcutAllowed()) return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (isPlaying) stopPlayback(); else startPlayback();
    return;
  }

  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const field = mainBpmField[state.topBar.activeTab];
  if (!field) return;
  // Shift matches the ±5 buttons; a bare press matches ±1. Holding the key
  // repeats natively, so no repeat handling of our own is needed.
  const step = (e.shiftKey ? 5 : 1) * (e.key === 'ArrowUp' ? 1 : -1);
  e.preventDefault();
  field.set(Number(field.input.value) + step);
  persistState();
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn && e.detail !== 0) btn.blur();
});

const QUICK_SELECT_PRESETS = {
  bpm: [40, 60, 80, 100, 120, 140, 160, 180, 200],
  percent: [50, 70, 85, 100, 115, 130],
  deltaPercent: [20, 35, 50, 65, 80],
  scaleAmount: [1, 2, 3, 5, 10],
  bars: [1, 2, 4, 8],
  breakBeats: [2, 4, 8, 16],
  patternBeats: [2, 3, 4, 5, 6, 7, 8, 12, 16],
  patternDivision: [1, 2, 3, 4, 5, 6, 8],
};

let quickSelectIdCounter = 0;
let openQuickSelectPopup = null;

function closeOpenQuickSelectPopup() {
  if (!openQuickSelectPopup) return;
  const { popup, toggle } = openQuickSelectPopup;
  popup.remove();
  toggle.setAttribute('aria-expanded', 'false');
  openQuickSelectPopup = null;
}

document.addEventListener('scroll', (e) => {
  // Deviation from brief: the popup's own scrollIntoView() (in setHighlight,
  // called from openPopup) fires an async 'scroll' event on the popup itself
  // that reaches this capturing listener after openQuickSelectPopup is
  // already assigned, immediately closing the popup that was just opened.
  // Excluding scrolls that originate inside the popup — mirroring the
  // popup.contains(e.target) check the click listener below already uses —
  // fixes this without changing the "close on outside scroll" behavior.
  if (!openQuickSelectPopup) return;
  if (openQuickSelectPopup.popup.contains(e.target)) return;
  closeOpenQuickSelectPopup();
}, true);
window.addEventListener('resize', closeOpenQuickSelectPopup);
document.addEventListener('click', (e) => {
  if (!openQuickSelectPopup) return;
  const { popup, toggle } = openQuickSelectPopup;
  if (e.target === toggle || popup.contains(e.target)) return;
  closeOpenQuickSelectPopup();
});

function attachQuickSelect(inputEl, presets, onSelect) {
  const toggle = document.createElement('button');
  toggle.type = 'button';
  // Not `.step-btn` — see the CSS comment above `.quick-select-toggle`.
  toggle.className = 'quick-select-toggle';
  toggle.setAttribute('aria-haspopup', 'listbox');
  toggle.setAttribute('aria-expanded', 'false');
  const labelEl = document.querySelector(`label[for="${inputEl.id}"]`);
  toggle.setAttribute('aria-label', `Quick-select ${labelEl ? labelEl.textContent.trim() : 'value'}`);
  toggle.textContent = '▾';
  inputEl.insertAdjacentElement('afterend', toggle);

  function openPopup() {
    closeOpenQuickSelectPopup();
    const currentValue = Number(inputEl.value);
    const values = buildQuickSelectValues(presets, currentValue);

    const popup = document.createElement('div');
    popup.className = 'quick-select-popup';
    popup.setAttribute('role', 'listbox');
    popup.tabIndex = -1;

    let highlightedIndex = values.indexOf(currentValue);
    if (highlightedIndex === -1) highlightedIndex = 0;

    const options = values.map((value) => {
      const option = document.createElement('div');
      option.id = `quick-select-option-${quickSelectIdCounter++}`;
      option.className = 'quick-select-option';
      option.setAttribute('role', 'option');
      option.textContent = String(value);
      option.addEventListener('click', () => {
        onSelect(value);
        closeOpenQuickSelectPopup();
        inputEl.focus();
      });
      popup.appendChild(option);
      return option;
    });

    function setHighlight(index) {
      options.forEach((opt, i) => {
        opt.classList.toggle('highlighted', i === index);
        opt.setAttribute('aria-selected', i === index ? 'true' : 'false');
      });
      highlightedIndex = index;
      popup.setAttribute('aria-activedescendant', options[index].id);
      options[index].scrollIntoView({ block: 'center' });
    }

    popup.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setHighlight(Math.min(highlightedIndex + 1, options.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setHighlight(Math.max(highlightedIndex - 1, 0));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        options[highlightedIndex].click();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeOpenQuickSelectPopup();
        toggle.focus();
      }
    });

    document.body.appendChild(popup);
    const rect = toggle.getBoundingClientRect();
    const popupHeight = popup.offsetHeight;
    const popupWidth = popup.offsetWidth;

    let top = rect.bottom + 4;
    if (top + popupHeight > window.innerHeight) {
      // Not enough room below the toggle — flip to render above it instead.
      top = rect.top - popupHeight - 4;
    }
    top = Math.max(top, 8);
    let left = rect.left;
    if (left + popupWidth > window.innerWidth - 8) {
      left = window.innerWidth - popupWidth - 8;
    }
    left = Math.max(left, 8);
    popup.style.top = top + 'px';
    popup.style.left = left + 'px';

    setHighlight(highlightedIndex);
    toggle.setAttribute('aria-expanded', 'true');
    openQuickSelectPopup = { popup, toggle };
    popup.focus({ preventScroll: true });
  }

  toggle.addEventListener('click', () => {
    if (openQuickSelectPopup && openQuickSelectPopup.toggle === toggle) {
      closeOpenQuickSelectPopup();
    } else {
      openPopup();
    }
  });

  toggle.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      // Stop this from reaching the document-level global Space handler,
      // which would otherwise toggle playback (the toggle button's tagName,
      // 'BUTTON', isn't in that handler's ignore list). Space on an unopened
      // toggle should open the popup, mirroring ArrowDown below.
      e.preventDefault();
      e.stopPropagation();
      if (!openQuickSelectPopup) openPopup();
      return;
    }
    if (e.key === 'ArrowDown' && !openQuickSelectPopup) {
      e.preventDefault();
      openPopup();
    }
  });
}

const LEVEL_CLASSES = ['level-muted', 'level-quiet', 'level-normal', 'level-accent'];
const LEVEL_NAMES = ['muted', 'quiet', 'normal', 'accented'];

// Roving tabindex anchor. Exactly one slot is tabbable at a time, so the grid
// is a single Tab stop however large it grows — without this, reaching the
// Start button from the editor means tabbing through up to 4096 buttons.
let patternFocusIndex = 0;

function applySlotStyle(el, level, division) {
  const index = Number(el.dataset.index);
  for (let i = 0; i < LEVEL_CLASSES.length; i++) {
    el.classList.toggle(LEVEL_CLASSES[i], i === level);
  }
  const beat = Math.floor(index / division) + 1;
  const slot = (index % division) + 1;
  el.setAttribute('aria-label', `Beat ${beat}, slot ${slot} of ${division}, ${LEVEL_NAMES[level]}`);
}

function updatePatternSlotCountLabel() {
  const pattern = state.topBar.pattern;
  const count = patternSlotCount(pattern.beats, pattern.division);
  document.getElementById('patternSlotCount').textContent =
    count === 1 ? '1 slot' : `${count} slots`;
}

// Builds the whole grid in one fragment. Click handling is delegated to the
// container in bindPatternEditor, so this attaches no per-slot listeners —
// 4096 elements is tractable, 4096 listeners is not.
function renderPatternGrid() {
  const grid = document.getElementById('patternGrid');
  const pattern = state.topBar.pattern;
  const fragment = document.createDocumentFragment();
  const total = patternSlotCount(pattern.beats, pattern.division);
  if (patternFocusIndex >= total) patternFocusIndex = total - 1;
  if (patternFocusIndex < 0) patternFocusIndex = 0;

  for (let beat = 0; beat < pattern.beats; beat++) {
    const row = document.createElement('div');
    row.className = 'pattern-row';
    const number = document.createElement('span');
    number.className = 'pattern-beat-number';
    number.setAttribute('aria-hidden', 'true');
    number.textContent = String(beat + 1);
    row.appendChild(number);
    for (let slot = 0; slot < pattern.division; slot++) {
      const index = patternSlotIndex(beat, slot, pattern.division);
      const el = document.createElement('button');
      el.type = 'button';
      el.className = slot === 0 ? 'pattern-slot beat-start' : 'pattern-slot';
      el.dataset.index = String(index);
      el.tabIndex = index === patternFocusIndex ? 0 : -1;
      applySlotStyle(el, patternLevelAt(pattern, beat, slot), pattern.division);
      row.appendChild(el);
    }
    fragment.appendChild(row);
  }

  grid.innerHTML = '';
  grid.appendChild(fragment);
  updatePatternSlotCountLabel();
}

function applyPatternEditorOpen() {
  const open = state.topBar.patternEditorOpen !== false;
  const toggle = document.getElementById('patternToggle');
  // #patternBody, not #patternGrid — the legend collapses with the grid it
  // explains, and the CSS carries the matching [hidden] rule.
  document.getElementById('patternBody').hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  toggle.textContent = open ? 'Hide' : 'Show';
}

function bindPatternEditor() {
  const preset = document.getElementById('patternPreset');
  const beats = document.getElementById('patternBeats');
  const division = document.getElementById('patternDivision');
  const grid = document.getElementById('patternGrid');
  const toggle = document.getElementById('patternToggle');

  // Runs at bind time, which is before refreshAllInputsFromState assigns
  // select.value from saved state — a <select> silently ignores a value
  // matching no option, and would render blank. Non-breaking spaces because
  // an <option>'s ordinary whitespace collapses.
  PATTERN_PRESETS.forEach((entry) => {
    const option = document.createElement('option');
    option.value = entry.name;
    option.textContent = entry.glyph + '\u00A0\u00A0' + entry.label;
    preset.appendChild(option);
  });
  const customOption = document.createElement('option');
  customOption.value = 'custom';
  customOption.textContent = 'Custom';
  preset.appendChild(customOption);

  // Resizing the grid invalidates in-flight playhead records and can leave the
  // bar counter past the new end, so both are corrected here in one place.
  function afterPatternResize() {
    const pattern = state.topBar.pattern;
    patternGeneration++;
    // Re-rendering the grid wipes the .playhead class but not the index the
    // frame loop compares against; without this the first post-resize record
    // carrying that same index would be skipped and no slot would light while
    // the rest of the grid sits dimmed by body.playing.
    clearPlayhead();
    beatIndexInBar = beatIndexInBar % pattern.beats;
    renderPatternGrid();
    // Practice is the one mode that must not re-render here: mid-playback its
    // dot row shows phase progress, not bar position, and would be silently
    // replaced by a bar-sized row. Everywhere else the row has to follow the
    // new beat count immediately, or it disagrees with the audio — and
    // flashBeatIndicator finds no dot for the beats past the old end.
    if (!isPlaying || state.topBar.activeTab !== 'practice') renderDotRow(pattern.beats);
  }

  function setBeats(value) {
    const pattern = state.topBar.pattern;
    const clamped = clampPatternBeats(value);
    if (wasValueClamped(value, clamped, 0)) flashClamped(beats);
    pattern.levels = resizePatternLevels(
      pattern.levels, pattern.beats, pattern.division, clamped, pattern.division
    );
    pattern.beats = clamped;
    pattern.preset = presetForPattern(pattern);
    beats.value = clamped;
    preset.value = pattern.preset;
    afterPatternResize();
  }

  function setDivision(value) {
    const pattern = state.topBar.pattern;
    const clamped = clampPatternDivision(value);
    if (wasValueClamped(value, clamped, 0)) flashClamped(division);
    pattern.levels = resizePatternLevels(
      pattern.levels, pattern.beats, pattern.division, pattern.beats, clamped
    );
    pattern.division = clamped;
    pattern.preset = presetForPattern(pattern);
    division.value = clamped;
    preset.value = pattern.preset;
    afterPatternResize();
  }

  function setPreset(name) {
    const entry = presetByName(name);
    if (entry === null) {
      // "Custom" is a label the app applies, never a choice that changes the
      // grid; snap the control back to whatever the pattern actually is.
      preset.value = state.topBar.pattern.preset;
      return;
    }
    const pattern = state.topBar.pattern;
    pattern.division = entry.division;
    pattern.preset = entry.name;
    pattern.levels = buildPresetLevels(pattern.beats, entry);
    division.value = entry.division;
    afterPatternResize();
  }

  preset.addEventListener('change', () => { setPreset(preset.value); persistState(); });
  beats.addEventListener('change', () => { setBeats(beats.value); persistState(); });
  division.addEventListener('change', () => { setDivision(division.value); persistState(); });

  attachQuickSelect(beats, QUICK_SELECT_PRESETS.patternBeats, (v) => { setBeats(v); persistState(); });
  attachQuickSelect(division, QUICK_SELECT_PRESETS.patternDivision, (v) => { setDivision(v); persistState(); });

  const stepperFields = {
    patternBeats: { input: beats, set: setBeats },
    patternDivision: { input: division, set: setDivision },
  };
  document.getElementById('patternHeader').querySelectorAll('.step-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const field = stepperFields[btn.dataset.stepTarget];
      field.set(Number(field.input.value) + Number(btn.dataset.step));
      persistState();
    });
  });

  toggle.addEventListener('click', () => {
    state.topBar.patternEditorOpen = !(state.topBar.patternEditorOpen !== false);
    applyPatternEditorOpen();
    persistState();
  });

  function cycleSlot(el, direction) {
    const pattern = state.topBar.pattern;
    const index = Number(el.dataset.index);
    const next = cyclePatternLevel(pattern.levels[index], direction);
    pattern.levels[index] = next;
    // Re-derive rather than hard-code 'custom': cycling a slot back to its
    // original level can leave the grid byte-identical to the preset it
    // started from, and the dropdown must say so.
    pattern.preset = presetForPattern(pattern);
    preset.value = pattern.preset;
    patternFocusIndex = index;
    applySlotStyle(el, next, pattern.division);
    persistState();
  }

  // Resolves Up/Down against the wrapped layout. How many beat blocks share a
  // line is counted from where the blocks actually landed rather than derived
  // from widths and gaps, so it stays correct whatever padding, the column gap
  // or a scrollbar takes out of the available width, and it needs no notion of
  // which breakpoint produced the current layout. The forced layout read costs
  // one Up/Down keypress, not one frame — nothing on the playback path calls
  // this.
  function verticalNeighbor(index, direction) {
    const pattern = state.topBar.pattern;
    const rows = grid.querySelectorAll('.pattern-row');
    let perLine = 0;
    if (rows.length > 0) {
      const top = rows[0].offsetTop;
      while (perLine < rows.length && rows[perLine].offsetTop === top) perLine++;
    }
    return patternVerticalNeighbor(index, pattern.division, pattern.beats, perLine, direction);
  }

  // Moves the single tabbable slot. Focusing inside the scroll box scrolls it,
  // which is wanted here — unlike the playhead, which deliberately never
  // scrolls, because this movement is the user's own and that one is not.
  function moveSlotFocus(index) {
    const target = grid.querySelector(`.pattern-slot[data-index="${index}"]`);
    if (!target) return;
    const current = grid.querySelector('.pattern-slot[tabindex="0"]');
    if (current) current.tabIndex = -1;
    target.tabIndex = 0;
    target.focus();
    patternFocusIndex = index;
  }

  // Two delegated listeners for every slot, however many there are.
  grid.addEventListener('click', (e) => {
    const el = e.target.closest('.pattern-slot');
    if (!el) return;
    cycleSlot(el, e.shiftKey ? -1 : 1);
  });

  grid.addEventListener('keydown', (e) => {
    const el = e.target.closest('.pattern-slot');
    if (!el) return;
    const pattern = state.topBar.pattern;
    const total = patternSlotCount(pattern.beats, pattern.division);
    const index = Number(el.dataset.index);
    const rowStart = Math.floor(index / pattern.division) * pattern.division;

    // Plain Enter/Space fires a click and cycles forward for free — which
    // depends on the document-level transport shortcut skipping anything
    // focused inside #patternEditor, since it would otherwise preventDefault
    // the Space that produces that click. Shift plus either is the keyboard
    // equivalent of shift-click; preventDefault here also suppresses the click
    // that Space would otherwise fire on keyup, so the level moves one step,
    // not two.
    if ((e.key === 'Enter' || e.key === ' ') && e.shiftKey) {
      e.preventDefault();
      cycleSlot(el, -1);
      return;
    }

    let next = null;
    if (e.key === 'ArrowRight') next = Math.min(total - 1, index + 1);
    else if (e.key === 'ArrowLeft') next = Math.max(0, index - 1);
    // Down/Up follow the wrapped layout, not the beat order: with blocks side
    // by side the next beat is to the right, so stepping one beat here would
    // send the caret sideways under a key that promises vertical movement.
    // When one block fills a line the jump is one beat again, as it always was.
    else if (e.key === 'ArrowDown') next = verticalNeighbor(index, 1);
    else if (e.key === 'ArrowUp') next = verticalNeighbor(index, -1);
    else if (e.key === 'Home') next = rowStart;
    else if (e.key === 'End') next = Math.min(total - 1, rowStart + pattern.division - 1);
    else return;

    e.preventDefault();
    moveSlotFocus(next);
  });
}

bindMetronomeTab();

let tapTimestamps = [];

const BPM_FIELD_MAP = {
  metronomeBpm: { key: 'metronome', prop: 'bpm', updatesHero: true },
  rampStartBpm: { key: 'ramp', prop: 'startBpm', updatesHero: true },
  rampStopBpm: { key: 'ramp', prop: 'stopBpm', updatesHero: false },
  practiceBaseBpm: { key: 'practice', prop: 'baseBpm', updatesHero: true },
};

// Driven from BPM_FIELD_MAP rather than from the .tapTempo buttons. Tap used to
// reach its field with btn.previousElementSibling, and that stopped being the
// input the moment attachQuickSelect began inserting its chevron directly after
// it: the element before Tap became that button, whose id is '', so
// BPM_FIELD_MAP[''] was undefined and every Tap on every tab threw on
// target.key instead of setting a tempo. The map already names every field Tap
// may write to, so resolving each one by id removes the positional assumption
// instead of working around it, and stays correct however the controls inside a
// .stepper-row are reordered. A field with no Tap button in its row is skipped.
Object.keys(BPM_FIELD_MAP).forEach((inputId) => {
  const input = document.getElementById(inputId);
  const row = input && input.closest('.stepper-row');
  const btn = row && row.querySelector('.tapTempo');
  if (!btn) return;
  const target = BPM_FIELD_MAP[inputId];

  btn.addEventListener('click', () => {
    const now = Date.now();
    if (tapTimestamps.length > 0 && now - tapTimestamps[tapTimestamps.length - 1] > 2000) {
      tapTimestamps = [];
    }
    tapTimestamps.push(now);
    if (tapTimestamps.length > 8) tapTimestamps = tapTimestamps.slice(-8);

    const bpm = bpmFromTapTimestamps(tapTimestamps);
    if (bpm === null) return;

    state[target.key][target.prop] = bpm;
    input.value = bpm;
    const range = document.getElementById(inputId + 'Range');
    if (range) range.value = bpm;
    if (target.updatesHero) updateHeroBpm();
    persistState();
  });
});

function switchTab(tabName) {
  if (isPlaying) stopPlayback();
  state.topBar.activeTab = tabName;
  persistState();

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  document.getElementById('panel-metronome').hidden = tabName !== 'metronome';
  document.getElementById('panel-ramp').hidden = tabName !== 'ramp';
  document.getElementById('panel-practice').hidden = tabName !== 'practice';
  document.getElementById('rampReadout').hidden = tabName !== 'ramp';
  document.getElementById('practiceReadout').hidden = tabName !== 'practice';
  renderDotRow(state.topBar.pattern.beats);
  updateHeroBpm();
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function bindRampTab() {
  const startBpm = document.getElementById('rampStartBpm');
  const startBpmRange = document.getElementById('rampStartBpmRange');
  const stopBpm = document.getElementById('rampStopBpm');
  const stopBpmRange = document.getElementById('rampStopBpmRange');
  const scaleMode = document.getElementById('rampScaleMode');
  const scaleAmount = document.getElementById('rampScaleAmount');
  const stepBars = document.getElementById('rampStepBars');

  function setStartBpm(value) {
    const clamped = clampBpm(value);
    if (wasValueClamped(value, clamped, 0)) flashClamped(startBpm);
    state.ramp.startBpm = clamped;
    startBpm.value = state.ramp.startBpm;
    startBpmRange.value = state.ramp.startBpm;
    updateHeroBpm();
  }
  function setStopBpm(value) {
    const clamped = clampBpm(value);
    if (wasValueClamped(value, clamped, 0)) flashClamped(stopBpm);
    state.ramp.stopBpm = clamped;
    stopBpm.value = state.ramp.stopBpm;
    stopBpmRange.value = state.ramp.stopBpm;
  }
  function setScaleAmount(value) {
    const n = Number(value);
    const clamped = Number.isFinite(n) && n > 0 ? Math.round(n * 10) / 10 : DEFAULT_STATE.ramp.scaleAmount;
    if (wasValueClamped(value, clamped, 1)) flashClamped(scaleAmount);
    state.ramp.scaleAmount = clamped;
    scaleAmount.value = state.ramp.scaleAmount;
  }
  function setStepBars(value) {
    const clamped = clampPositiveInt(value, DEFAULT_STATE.ramp.stepBars);
    if (wasValueClamped(value, clamped, 0)) flashClamped(stepBars);
    state.ramp.stepBars = clamped;
    stepBars.value = state.ramp.stepBars;
  }

  startBpm.addEventListener('change', () => { setStartBpm(startBpm.value); persistState(); });
  startBpmRange.addEventListener('input', () => { setStartBpm(startBpmRange.value); persistState(); });
  stopBpm.addEventListener('change', () => { setStopBpm(stopBpm.value); persistState(); });
  stopBpmRange.addEventListener('input', () => { setStopBpm(stopBpmRange.value); persistState(); });
  scaleMode.addEventListener('change', () => { state.ramp.scaleMode = scaleMode.value; persistState(); });
  scaleAmount.addEventListener('change', () => { setScaleAmount(scaleAmount.value); persistState(); });
  stepBars.addEventListener('change', () => { setStepBars(stepBars.value); persistState(); });

  attachQuickSelect(startBpm, QUICK_SELECT_PRESETS.bpm, (v) => { setStartBpm(v); persistState(); });
  attachQuickSelect(stopBpm, QUICK_SELECT_PRESETS.bpm, (v) => { setStopBpm(v); persistState(); });
  attachQuickSelect(scaleAmount, QUICK_SELECT_PRESETS.scaleAmount, (v) => { setScaleAmount(v); persistState(); });
  attachQuickSelect(stepBars, QUICK_SELECT_PRESETS.bars, (v) => { setStepBars(v); persistState(); });

  const stepperFields = {
    rampStartBpm: { input: startBpm, set: setStartBpm },
    rampStopBpm: { input: stopBpm, set: setStopBpm },
    rampScaleAmount: { input: scaleAmount, set: setScaleAmount },
    rampStepBars: { input: stepBars, set: setStepBars },
  };

  // Stop, not Start: mid-run Start is spent — the runtime seeded from it at
  // launch — while Stop is read live on every step, so moving it from the
  // keyboard is what lets a ramp sitting at the top set off for a new target.
  mainBpmField.ramp = stepperFields.rampStopBpm;

  document.getElementById('panel-ramp').querySelectorAll('.step-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.step);
      const field = stepperFields[btn.dataset.stepTarget];
      field.set(Number(field.input.value) + delta);
      persistState();
    });
  });
}

bindRampTab();

function bindPracticeTab() {
  const baseBpm = document.getElementById('practiceBaseBpm');
  const baseBpmRange = document.getElementById('practiceBaseBpmRange');
  const deltaPercent = document.getElementById('practiceDeltaPercent');
  const deltaPercentRange = document.getElementById('practiceDeltaPercentRange');
  const barsPerPhase = document.getElementById('practiceBarsPerPhase');
  const breakBeats = document.getElementById('practiceBreakBeats');

  function setBaseBpm(value) {
    const clamped = clampBpm(value);
    if (wasValueClamped(value, clamped, 0)) flashClamped(baseBpm);
    state.practice.baseBpm = clamped;
    baseBpm.value = state.practice.baseBpm;
    baseBpmRange.value = state.practice.baseBpm;
    updateHeroBpm();
  }
  function setDeltaPercent(value) {
    const n = Math.round(Number(value));
    const clamped = Number.isFinite(n) ? Math.min(90, Math.max(10, n)) : DEFAULT_STATE.practice.deltaPercent;
    if (wasValueClamped(value, clamped, 0)) flashClamped(deltaPercent);
    state.practice.deltaPercent = clamped;
    deltaPercent.value = state.practice.deltaPercent;
    deltaPercentRange.value = state.practice.deltaPercent;
  }
  function setBarsPerPhase(value) {
    const clamped = clampPositiveInt(value, DEFAULT_STATE.practice.barsPerPhase);
    if (wasValueClamped(value, clamped, 0)) flashClamped(barsPerPhase);
    state.practice.barsPerPhase = clamped;
    barsPerPhase.value = state.practice.barsPerPhase;
  }
  function setBreakBeats(value) {
    const clamped = clampPositiveInt(value, DEFAULT_STATE.practice.breakBeats);
    if (wasValueClamped(value, clamped, 0)) flashClamped(breakBeats);
    state.practice.breakBeats = clamped;
    breakBeats.value = state.practice.breakBeats;
  }

  baseBpm.addEventListener('change', () => { setBaseBpm(baseBpm.value); persistState(); });
  baseBpmRange.addEventListener('input', () => { setBaseBpm(baseBpmRange.value); persistState(); });
  deltaPercent.addEventListener('change', () => { setDeltaPercent(deltaPercent.value); persistState(); });
  deltaPercentRange.addEventListener('input', () => { setDeltaPercent(deltaPercentRange.value); persistState(); });
  barsPerPhase.addEventListener('change', () => { setBarsPerPhase(barsPerPhase.value); persistState(); });
  breakBeats.addEventListener('change', () => { setBreakBeats(breakBeats.value); persistState(); });

  attachQuickSelect(baseBpm, QUICK_SELECT_PRESETS.bpm, (v) => { setBaseBpm(v); persistState(); });
  attachQuickSelect(deltaPercent, QUICK_SELECT_PRESETS.deltaPercent, (v) => { setDeltaPercent(v); persistState(); });
  attachQuickSelect(barsPerPhase, QUICK_SELECT_PRESETS.bars, (v) => { setBarsPerPhase(v); persistState(); });
  attachQuickSelect(breakBeats, QUICK_SELECT_PRESETS.breakBeats, (v) => { setBreakBeats(v); persistState(); });

  const stepperFields = {
    practiceBaseBpm: { input: baseBpm, set: setBaseBpm },
    practiceDeltaPercent: { input: deltaPercent, set: setDeltaPercent },
    practiceBarsPerPhase: { input: barsPerPhase, set: setBarsPerPhase },
    practiceBreakBeats: { input: breakBeats, set: setBreakBeats },
  };

  // Base BPM is what both phases are derived from, so it moves the whole
  // exercise. currentModeBpm reads it live, so a nudge lands on the next beat.
  mainBpmField.practice = stepperFields.practiceBaseBpm;

  document.getElementById('panel-practice').querySelectorAll('.step-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.step);
      const field = stepperFields[btn.dataset.stepTarget];
      field.set(Number(field.input.value) + delta);
      persistState();
    });
  });
}
