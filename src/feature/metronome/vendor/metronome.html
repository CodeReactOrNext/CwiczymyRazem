<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitar Practice Metronome</title>
<!-- Vendored from https://github.com/marxd262/Metronome (c350c1d) by marxd262,
     used with the author's permission. Only change: the classic theme's colours.
     Not served as-is: scripts/buildMetronome.mjs turns it into
     src/feature/metronome/generated/metronomeApp.ts for /tools/metronome. -->
<style>
@layer base, components, themes, motion;

@layer base {
  :root {
    color-scheme: dark;

    /* ── Primitives — raw values, named for what they are ── */
    --neutral-975: #0e0e12;
    --neutral-950: #15151a;
    --neutral-900: #1e1e25;
    --neutral-850: #26262f;
    --neutral-800: #2a2a33;
    --neutral-500: #666672;
    --neutral-300: #9ba0a8;
    --neutral-100: #e8e8ec;
    --accent-500:  #f5a623;
    --accent-950:  #1a1305;
    --red-500:     #e5484d;

    /* Reserved surface roles, unthemed. The themed surface/text/accent
       tokens (--bg/--panel/--overlay/--divider/--text/--accent/etc.) are
       not defined here — each :root[data-theme="…"] block in @layer
       themes supplies them, so a theme always wins over this layer
       structurally. --sunken/--inverse remain reserved: nothing shows an
       inset/code area or an inverted block. */
    --sunken:  var(--neutral-975);
    --inverse: var(--neutral-100);

    --radius-lg: 999px;
    --radius-round: 50%;

    /* Shadows — --shadow-md floats the quick-select popup above the panel
       behind it. --shadow-sm/--shadow-lg remain reserved for the day another
       floating element needs a lighter/heavier depth cue. Calibrated with
       higher alpha than a typical light-mode scale, since a shadow needs more
       contrast punch to read against a near-black canvas. */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.4), 0 4px 8px rgba(0, 0, 0, 0.3);

    /* Z-index — --z-overlay lifts the quick-select popup above page content.
       --z-base/--z-raised remain reserved for the day ordinary in-flow
       content needs explicit stacking. */
    --z-base:    0;
    --z-raised:  1;
    --z-overlay: 10;

    /* Motion — owned here permanently; no theme may redefine these four. */
    --duration-instant: 0.05s;
    --duration-fast: 0.15s;
    --duration-moderate: 0.3s;
    --ease-standard: ease;

    /* Type weight */
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    /* Type scale */
    --text-xs:   0.75rem;
    --text-sm:   0.875rem;
    --text-base: 1rem;
    /* Fluid, not fixed: the desktop layout gives the hero its own column, and a
       72px number in a 460px column reads as a phone screenshot pasted onto a
       monitor. The lower clamp bound is the old fixed value, and 3.5rem + 3vw
       only exceeds it above a ~533px viewport, so every phone keeps today's size
       exactly. */
    --text-hero: clamp(4.5rem, 3.5rem + 3vw, 6.5rem);

    /* Leading */
    --leading-none:   1;
    --leading-normal: 1.45;

    /* Tracking */
    --tracking-tighter: -0.035em;
    --tracking-tight:  -0.02em;
    --tracking-snug:    0.02em;
    --tracking-wide:    0.04em;
    --tracking-wider:   0.12em;
    --tracking-widest:  0.15em;

    /* Spacing scale */
    --space-2xs: 0.5rem;
    --space-xs:  0.75rem;
    --space-sm:  1rem;
    --space-md:  1.25rem;
    --space-lg:  1.5rem;
    --space-xl:  2rem;
    --space-2xl: 2.5rem;
    --space-3xl: 3rem;

    /* Component sizing — dimensions for one specific control, not gaps/margins,
       so deliberately outside the spacing scale above rather than forced onto it. */
    --quick-select-popup-max-height: 12.5rem;
    --quick-select-popup-min-width: 4.5rem;

    /* Body width once the two-column desktop layout kicks in. Each theme
       overrides this beside its --content-max-width; the default here means a
       future theme that forgets to is merely narrow, never broken. Deliberately
       NOT added to REQUIRED_TOKENS for that reason. */
    --content-max-width-wide: 1080px;

    /* The viewport at which the single column splits into controls + hero. */
    --breakpoint-wide: 900px;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    max-width: var(--content-max-width);
    margin: var(--space-2xl) auto;
    /* Four-value shorthand, not padding-inline/-block longhands: Grid Console
       restates `padding` as a shorthand from @layer themes, which would drop
       longhands entirely. max() keeps the normal gutter on every phone without
       a notch and grows only where the inset is real. */
    padding:
      0
      max(var(--space-md), env(safe-area-inset-right))
      calc(var(--space-3xl) + env(safe-area-inset-bottom))
      max(var(--space-md), env(safe-area-inset-left));
    line-height: var(--leading-normal);
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  /* Without this a phone browser holds each tap ~300ms waiting for a possible
     double-tap zoom. That is a latency bug on a metronome: Tap Tempo averages
     the intervals a user taps, and the pattern slots are cycled by repeated
     taps. Covers .pattern-slot too — slots are <button> elements. */
  button,
  select,
  input[type="range"],
  input[type="number"] {
    touch-action: manipulation;
  }

}

@layer components {

body {
  font-family: var(--font-ui);
}

h1 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--text-muted);
  text-align: center;
  margin: 0 0 var(--space-xl);
}

#masthead {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-xl);
}

#masthead h1 { flex: 1; margin: 0; }

#themeSelect { flex: 0 0 auto; }

#topbar {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-sm) var(--space-lg);
  align-items: end;
  padding-bottom: var(--space-md);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
  font-size: var(--text-xs);
}

#topbar .full {
  grid-column: 1 / -1;
}

#volumeValue {
  font-variant-numeric: tabular-nums;
}

#tabs {
  display: flex;
  gap: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
  margin-bottom: var(--space-lg);
}

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font: inherit;
  font-size: var(--text-base);
  padding: var(--space-xs) var(--space-2xs);
  margin-bottom: -1px;
  cursor: pointer;
  text-align: center;
  border-bottom: 2px solid transparent;
  transition: color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.tab-btn:hover {
  color: var(--text);
  background: var(--panel);
}

.tab-btn:active { transform: scale(0.98); }

.tab-btn.active {
  color: var(--accent);
  font-weight: var(--font-weight-semibold);
  border-bottom-color: var(--accent);
}

.panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  padding-bottom: var(--space-lg);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
}

.panel[hidden] { display: none; }

@media (prefers-reduced-motion: no-preference) {
  .panel:not([hidden]), .readout:not([hidden]) {
    animation: panel-fade-in var(--duration-moderate) var(--ease-standard) both;
  }
}

}

@keyframes panel-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@layer components {

#heroZone {
  text-align: center;
  /* Small, because #controls sits directly beneath the readout and closes the
     cluster visually. The gap a reader actually sees is this plus #controls'
     own margin-top, which three themes raise to --space-lg. */
  margin-bottom: var(--space-2xs);
}

.hero-frame { position: relative; }

#beatFlash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  #beatFlash { animation: none !important; }
}

#heroBpm {
  position: relative;
  isolation: isolate;
  font-size: var(--text-hero);
  font-weight: var(--font-weight-bold);
  font-family: var(--font-display);
  line-height: var(--leading-none);
  letter-spacing: var(--tracking-tighter);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: no-preference) {
  #heroBpm { animation: hero-enter 400ms var(--ease-standard) both; }
}

}

@keyframes hero-enter {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}

@layer components {

#heroBpmLabel {
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.35rem;
}

label,
.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
  font-size: var(--text-sm);
  color: var(--text-muted);
}

input[type="number"],
select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: var(--space-2xs);
  font: inherit;
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-standard);
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}

input[type="number"]:focus,
select:focus {
  border-color: var(--accent);
}

input[type="number"].clamped {
  border-color: var(--accent-beat);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
}

/* Must stay in THIS layer, below the `outline: none` rules above. Both declare
   `outline` and both match a focused control, so layer order decides the
   winner before specificity is ever consulted — parking this ring in `base`
   let the suppressions in `components` silently override it, which left the
   range slider with no keyboard focus indicator at all. Here the
   :focus-visible makes it the more specific rule and it wins, and no theme
   declares `outline`, so nothing downstream can take it away again.
   tests/themes.test.js enforces both halves of that. */
input[type="range"]:focus-visible,
input[type="number"]:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.tapTempo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: 0 var(--space-md);
  font-size: var(--text-sm);
  font-weight: var(--font-weight-semibold);
  transition: border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.tapTempo:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.tapTempo:active {
  transform: scale(0.94);
}

.stepper-row {
  display: flex;
  gap: var(--space-2xs);
  align-items: stretch;
}

.stepper-row input[type="number"] {
  flex: 1;
  min-width: 0;
}

.step-group {
  display: flex;
  gap: var(--space-2xs);
}

.step-btn {
  flex: 0 0 auto;
  width: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.step-btn.step-5 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

.step-btn:hover {
  background: var(--neutral-850);
  border-color: var(--accent);
  color: var(--accent);
}

.step-btn:active {
  transform: scale(0.94);
}

/* Deliberately its own class, not .step-btn — see Global Constraints:
   bind*Tab()'s querySelectorAll('.step-btn') delegation keys off
   data-step-target, which this button doesn't have. */
.quick-select-toggle {
  flex: 0 0 auto;
  width: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-xs);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.quick-select-toggle:hover {
  background: var(--neutral-850);
  border-color: var(--accent);
  color: var(--accent);
}

.quick-select-toggle:active {
  transform: scale(0.94);
}

.quick-select-toggle[aria-expanded="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

.quick-select-popup {
  position: fixed;
  z-index: var(--z-overlay);
  max-height: var(--quick-select-popup-max-height);
  overflow-y: auto;
  background: var(--overlay);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: var(--space-2xs) 0;
  min-width: var(--quick-select-popup-min-width);
}

.quick-select-option {
  padding: var(--space-2xs) var(--space-sm);
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
}

.quick-select-option:hover {
  background: var(--neutral-850);
  color: var(--text);
}

.quick-select-option.highlighted {
  background: var(--accent);
  color: var(--on-accent);
}

/* Start/Stop sits immediately after #heroZone in the DOM, not at the end of
   the page. On the single column that is the whole point: the primary action
   used to sit below the pattern editor and the mode panel, so starting the
   metronome on a phone meant scrolling past everything you had already set.
   Readout and transport are the two things a player looks at rather than
   adjusts, so they belong together at both widths. */
/* Reads against every theme without any of them overriding it: --accent-beat,
   --text-muted and --radius are all in REQUIRED_TOKENS, so each theme has
   already chosen its own values for them. Colour is not the only signal — the
   border and the position under the transport carry it too. */
#transportNote {
  max-width: 34ch;
  margin: 0;
  padding: var(--space-2xs) var(--space-xs);
  border: 1px solid var(--accent-beat);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: var(--text-xs);
  text-align: center;
  text-wrap: balance;
}

#controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  margin-top: var(--space-2xs);
  /* Separates the hero/transport cluster from the settings below it. No theme
     declares margin-bottom on #controls, so this holds in all five. */
  margin-bottom: var(--space-xl);
}

#startStop {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-3xl);
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-snug);
  transition: filter var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

#startStop:hover { filter: brightness(1.08); }
#startStop:active { transform: scale(0.98); }

#beatIndicator {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2xs);
  justify-content: center;
  margin-bottom: var(--space-sm);
}

.beat-dot {
  appearance: none;
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: var(--radius-round);
  background: var(--dot-idle);
  transition:
    background-color var(--dot-decay) var(--dot-ease),
    box-shadow       var(--dot-decay) var(--dot-ease),
    transform        var(--dot-decay) var(--dot-ease),
    filter           var(--duration-fast) var(--ease-standard),
    border-color     var(--duration-fast) var(--ease-standard);
}

.beat-dot.pulse       { background: var(--dot-pulse-bg); transition-duration: var(--dot-strike); }
.beat-dot.pulse.accent{ background: var(--dot-accent-bg); }

/* Group dots in 4s so long rows (practice phases up to 64 beats) stay countable at a glance */
#beatIndicator .beat-dot:nth-child(4n):not(:last-child) {
  margin-right: var(--space-2xs);
}

.readout {
  font-size: var(--text-xs);
  color: var(--text-muted);
  min-height: 1.2em;
  text-align: center;
  text-wrap: pretty;
  font-variant-numeric: tabular-nums;
  margin-top: var(--space-2xs);
}

.phase-segment {
  display: inline-block;
  transition: transform var(--duration-fast) var(--ease-standard), text-shadow var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.phase-segment.active {
  color: var(--accent);
  transform: scale(1.1);
  font-weight: var(--font-weight-semibold);
  text-shadow: 0 0 8px var(--accent);
}

}

@layer components {
  /* Sizing for the editor's own controls, deliberately outside the shared
     spacing scale for the same reason --quick-select-popup-* is: these are
     dimensions of one specific control, not gaps between things. */
  #patternEditor {
    /* 26px, not the 44px touch guideline. Adjacent grid cells cannot reach 44
       without their hit areas overlapping their neighbours, which trades a
       small target for a wrong one. 26px plus a 4px gap is the largest target
       that stays honest; the keyboard path added in Task 8 is the real
       accommodation for anyone who cannot hit it. */
    /* One size at every beat and division count. The editor used to shrink
       slots once a pattern grew past a threshold, which meant editing beats
       or division silently resized every cell you were aiming at. The design
       spec's reason for shrinking was "so the Start button is never pushed
       off screen at any setting"; that no longer applies, because the grid is
       capped at --pattern-grid-max-height and scrolls on both axes, and the
       transport now sits above the editor rather than below it. A pattern too
       wide for one line wraps its beat blocks instead, and only a single beat
       wider than the whole grid still scrolls sideways — a drag, never a
       mis-tap. */
    --pattern-slot-size: 26px;
    --pattern-grid-max-height: 40vh;

    border: 1px solid var(--divider);
    border-radius: var(--radius-panel);
    padding: var(--space-sm);
    margin-bottom: var(--space-sm);
    background: var(--panel);
  }

  #patternHeader {
    display: flex;
    gap: var(--space-sm);
    align-items: flex-end;
    flex-wrap: wrap;
  }

  /* Deliberately NOT .field-group, even though this is one. Kinetic Type and
     Grid Console restyle .field-group from the themes layer into a two-column
     grid with its own horizontal rule, padding and a wide minimum first
     column; layer order puts themes above components, so #patternHeader's flex
     row cannot override that. The header would gain a rule per field, and the
     Preset select — which neither theme gives a grid-column — would drop below
     its label while Beats and Division stayed beside theirs. Restating the two
     things the header actually needs (stack the label over its control, shared
     label typography) keeps the editor's own layout unreachable from the
     themes layer. The controls inside still theme normally, through the shared
     label/select/input/.stepper-row rules. */
  .pattern-field {
    display: flex;
    flex-direction: column;
    gap: var(--space-2xs);
    font-size: var(--text-sm);
    color: var(--text-muted);
    margin-bottom: 0;
  }

  #patternMeta {
    display: flex;
    align-items: center;
    gap: var(--space-2xs);
    margin-left: auto;
    font-size: var(--text-xs);
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  #patternToggle {
    font: inherit;
    font-weight: var(--font-weight-semibold);
    color: var(--text-muted);
    background: none;
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    padding: var(--space-2xs) var(--space-xs);
    cursor: pointer;
    transition: color var(--duration-fast) var(--ease-standard),
                border-color var(--duration-fast) var(--ease-standard);
  }

  #patternToggle:hover { color: var(--text); border-color: var(--accent); }

  /* An author display value beats the UA sheet's [hidden] { display: none },
     so the collapse silently does nothing without this rule. The project
     already hit this once: see .panel[hidden]. */
  #patternBody[hidden] { display: none; }

  #patternGrid {
    display: flex;
    /* Beat blocks flow across and wrap, so a pattern spends the width it has
       before it spends height. Every block is the same width — a 1.5rem number
       plus `division` identical slots — so the wrapped lines self-align into
       columns on their own and need no grid template to do it. */
    flex-wrap: wrap;
    /* Packs the wrapped lines at the top. The default stretch would spread them
       down the full max-height whenever the pattern is shorter than that cap,
       opening gaps between lines that read as pattern structure and are not. */
    align-content: flex-start;
    /* 16px between blocks against 4px inside one. That 4:1 ratio is the whole
       reason a beat still reads as a unit now that its neighbour sits beside it
       rather than below it — no border, tint or separator says it again. */
    column-gap: var(--space-sm);
    row-gap: 4px;
    margin-top: var(--space-sm);
    max-height: var(--pattern-grid-max-height);
    overflow: auto;
    /* Reserves the vertical scrollbar's gutter whether or not it is showing.
       Without it, stepping Beats past the point where the grid outgrows its
       max-height makes a scrollbar appear, which takes width away, which can
       drop the whole grid to one fewer block per line — every block jumping
       sideways on a single press of a stepper the user is holding down. The
       gutter costs a few idle pixels and buys a layout that only changes when
       the pattern does. */
    scrollbar-gutter: stable;
  }

  /* flex: none, not the flex-item default: shrinking is what a wrapping
     container tries before it wraps, and a shrunk block would squeeze its own
     slots — themselves flex: none — straight out of its padding box. Pinned at
     content width, a block that cannot fit wraps instead, and the one case that
     still cannot fit (a single beat wider than the grid) overflows into the
     sideways scroll the container already offers. */
  .pattern-row {
    display: flex;
    flex: none;
    align-items: center;
    gap: 4px;
    border-radius: var(--radius);
    padding: 2px;
  }

  .pattern-beat-number {
    width: 1.5rem;
    flex: none;
    text-align: right;
    padding-right: var(--space-2xs);
    font-size: var(--text-xs);
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  /* Deliberately NOT .beat-dot: the components layer locks that class's
     transition and five themes restate its states. A slot is a different
     control with a different lifecycle and must not inherit either. */
  .pattern-slot {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: var(--pattern-slot-size);
    height: var(--pattern-slot-size);
    padding: 0;
    border: 1px solid var(--divider);
    /* Deliberately NOT var(--radius): each theme scales that token for inputs
       and buttons, from 3px to 10px, and 10px on a 26px cell is a pill. A cell
       radius wants to stay a cell radius, and varying it against the section's
       --radius-panel is the point. */
    border-radius: 3px;
    background: var(--overlay);
    cursor: pointer;
    position: relative;
    transition: border-color var(--duration-fast) var(--ease-standard),
                background-color var(--duration-fast) var(--ease-standard);
  }

  /* The inner mark carries the level, so the four levels differ in fill size
     as well as colour and stay distinguishable without colour vision. */
  .pattern-slot::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 2px;
    width: 0;
    height: 0;
    background: var(--text);
  }

  .pattern-slot.level-muted {
    background: transparent;
    border-style: dashed;
    opacity: 0.5;
  }

  .pattern-slot.level-quiet::after  { width: 6px;  height: 6px;  background: var(--text-dim); }
  .pattern-slot.level-normal::after { width: 11px; height: 11px; background: var(--text); }

  /* Border and fill carry the accent, and no third signal. An earlier draft
     also tinted the background with --accent-glow, which Pulse Engine defines
     at 55% accent — three accent cues on one 26px cell, blocking nearly solid
     and spending the accent budget on a control that repeats up to 4096 times. */
  .pattern-slot.level-accent { border-color: var(--accent); }
  .pattern-slot.level-accent::after { width: 16px; height: 16px; background: var(--accent); }

  .pattern-slot.beat-start { border-color: var(--text-dim); }

  .pattern-slot:hover { border-color: var(--accent); }

  /* Playhead. Applied and removed from an animation frame, never from a
     transitionend listener, so it cannot get stuck the way .pulse once did. */
  .pattern-slot.playhead { box-shadow: 0 0 0 2px var(--accent), 0 0 12px var(--accent-glow); }

  /* Marks the beat block the playhead is inside, which since the blocks wrap is
     one beat wide rather than the grid's full width — the tighter box is the
     more useful one, because it names a beat instead of a screen row.
     Not var(--overlay): in Classic that token is the slot's own background and
     the section's border colour, all three #2a2a33, so the highlight would be
     invisible against the very cells it is meant to group. */
  .pattern-row.playhead-row { background: color-mix(in srgb, var(--accent) 10%, transparent); }

  /* While playing, everything but the sounding slot recedes so the playhead
     reads at a glance. The grid stays fully interactive — this is a reading
     emphasis, not a disabled state. body.playing is already toggled by
     setTransportState. */
  body.playing .pattern-slot:not(.playhead) { opacity: 0.7; }
  body.playing .pattern-slot.level-muted:not(.playhead) { opacity: 0.35; }

  /* The legend is the only thing that teaches four fill sizes. It sits inside
     the collapsible body so it disappears with the grid it explains. */
  #patternLegend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-sm);
    margin-top: var(--space-sm);
    padding-top: var(--space-xs);
    border-top: 1px solid var(--divider);
    font-size: var(--text-xs);
    color: var(--text-muted);
  }

  #patternLegend > span {
    display: flex;
    align-items: center;
    gap: var(--space-2xs);
  }

  #patternHint { margin-left: auto; color: var(--text-dim); }

  .pattern-swatch {
    width: 14px;
    height: 14px;
    flex: none;
    border: 1px solid var(--divider);
    border-radius: 3px;
    background: var(--overlay);
    position: relative;
  }

  .pattern-swatch::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 2px;
    width: 0;
    height: 0;
  }

  .pattern-swatch.level-muted { background: transparent; border-style: dashed; opacity: 0.5; }
  .pattern-swatch.level-quiet::after  { width: 4px; height: 4px; background: var(--text-dim); }
  .pattern-swatch.level-normal::after { width: 7px; height: 7px; background: var(--text); }
  .pattern-swatch.level-accent { border-color: var(--accent); }
  .pattern-swatch.level-accent::after { width: 9px; height: 9px; background: var(--accent); }
}

@layer components {

/* ══ Responsive skeleton ══════════════════════════════════════════════════
   Arrangement lives here, in @layer components, so all five themes share one
   layout and a theme supplies only colour, texture and typography. Grid
   Console is the single exception: it restates the wide layout for itself
   from @layer themes, which outranks this, and its block mirrors the row
   order below so the two never disagree about where the pattern editor sits.
   ════════════════════════════════════════════════════════════════════════ */

/* ── Coarse pointers ──
   Keyed on pointer type, not viewport width, so a large touchscreen gets the
   bigger targets and a narrow desktop window does not. .pattern-slot is
   deliberately excluded — see the --pattern-slot-size comment for why 26px is
   the honest maximum there. */
@media (pointer: coarse) {
  .step-btn,
  .tapTempo,
  .tab-btn,
  #patternToggle,
  #startStop { min-height: 44px; }

  .quick-select-toggle { min-width: 2.25rem; min-height: 44px; }

  .quick-select-option { padding-block: var(--space-xs); }

  input[type="range"]::-webkit-slider-thumb { width: 22px; height: 22px; }
  input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; }
}

/* ── Narrow phones ──
   The BPM stepper row is [-5][-][input][Tap][+][+5]. Under ~420px those six
   fixed-width controls leave the number input barely wider than the digits it
   holds. Wrapping Tap onto its own full-width line hands ~80px back to the
   input and makes Tap the largest target in the row, which is the right
   ranking: it is the one control a user hits repeatedly and in rhythm. */
@media (max-width: 420px) {
  .stepper-row { flex-wrap: wrap; }

  .stepper-row > .tapTempo {
    order: 1;
    flex: 1 0 100%;
    padding-block: var(--space-2xs);
  }
}

/* ── Scroll containment ──
   Both scroll inside a page that also scrolls. Without this, hitting the end
   of the inner scroll chains to the document and drags the whole page out
   from under a user scrubbing a long pattern. */
#patternGrid,
.quick-select-popup { overscroll-behavior: contain; }

/* ── Wide viewports: controls left, readout right ──
   Below this the layout is the original single column, unchanged. */
@media (min-width: 900px) {
  body {
    max-width: var(--content-max-width-wide);
    display: grid;
    /* Rows 1-2 are the full-width header band. Rows 3-5 are the three
       left-column children in DOM order: #tabs, #patternEditor, .panel.
       Exactly one .panel is ever in flow (the other two carry [hidden], which
       .panel[hidden] resolves to display:none), so that count is fixed at
       three. The two <script> elements are display:none per the UA sheet and
       the quick-select popup is position:fixed, so neither becomes a grid
       item. */
    grid-template-rows: auto auto repeat(3, auto);
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    column-gap: var(--space-2xl);
    align-items: start;
  }

  #masthead,
  #topbar { grid-column: 1 / -1; }

  /* Left column: the things you set. Visual order matches DOM order exactly,
     so reading order and tab order still agree — the reason the pattern
     editor stays above the mode panel rather than being reshuffled here. */
  #tabs,
  #patternEditor,
  .panel { grid-column: 1; }

  /* Right column: the things you watch. The readout and the transport are the
     two elements a user looks at rather than adjusts, so on desktop they
     become one cluster instead of bookending a scroll. #controls is already
     the last element in the DOM, so pulling it into column two costs nothing
     in reading or tab order.

     #stage is why they are wrapped rather than placed as two grid items.
     Placed separately, each one sizes a row of the shared grid, so the
     readout — taller than the tab strip beside it — inflated row 3 and opened
     a gap under #tabs in column one. One wrapper spanning every control row
     gives column two its own vertical flow: nothing it contains can push a
     row in column one, and the readout and transport stay adjacent because
     they are now siblings in a flex column rather than two items hoping the
     rows between them stay short.

     It is deliberately not position:sticky: Pulse Engine and Grid Console
     both pin .hero-frame to position:relative from @layer themes, so only a
     wrapper could stick, and a stuck box cannot also stretch-and-centre.
     Centring is correct in all five themes at every height; sticky only pays
     off once the page scrolls. */
  #stage {
    grid-column: 2;
    grid-row: 3 / -1;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  #heroZone { margin-bottom: 0; }

  #controls {
    margin-top: var(--space-lg);
    margin-bottom: 0;
  }

  /* The Sound select and the theme select both sit in grid columns sized for
     a phone. Left uncapped they stretch to ~500px to hold the word "Click".
     A cap, not a fixed width, so a longer option label can still grow. */
  #topbar select,
  #themeSelect { max-width: 16rem; }
}

}

@layer themes {

:root[data-theme="classic"] {
  /* riff.quest palette (Tailwind zinc + cyan/amber): the page embedding this
     file is bg-zinc-950, so the canvas matches it and the frame disappears. */
  --neutral-850:       #27272a;
  --bg:                #09090b;
  --panel:             #18181b;
  --overlay:           #27272a;
  --divider:           #27272a;
  --text:              #f4f4f5;
  --text-muted:        #a1a1aa;
  --text-dim:          #71717a;
  --accent:            #22d3ee;
  --accent-beat:       #fbbf24;
  --on-accent:         #09090b;
  --accent-glow:       color-mix(in srgb, var(--accent) 16%, transparent);
  --dot-idle:          #52525b;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        0.05s;
  --dot-decay:         0.05s;
  --dot-ease:          ease;
  /* Each theme carries both widths: the narrow single column and its
     wide two-column companion. See @layer base for the shared default. */
  --content-max-width: 480px;
  --content-max-width-wide: 1060px;
  --radius:            8px;
  --radius-panel:      8px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-ui);
}

:root[data-theme="classic"] .hero-frame  { display: flex; flex-direction: column; }
:root[data-theme="classic"] #beatIndicator { order: -1; }
:root[data-theme="classic"] #beatFlash   { display: none; }
:root[data-theme="classic"] #masthead h1 { text-align: center; }

/* Classic-only signature detail: an ambient glow behind the hero numeral.
   Originally unscoped in @layer components, which wrongly bloomed every
   theme's numeral (invisible in Pulse Engine only because its .hero-readout
   clips overflow) — moved here, theme-scoped, same declarations. */
:root[data-theme="classic"] #heroBpm::before {
  content: "";
  position: absolute;
  inset: -2.5rem -3.5rem;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, var(--accent-glow) 0%, transparent 50%);
}

:root[data-theme="pulse-engine"] {
  --bg:                #07070a;
  --panel:             #1a1a20;
  --overlay:           #25252d;
  --divider:           #2e2e38;
  --text:              #edeef2;
  --text-muted:        #a2a7b0;
  --text-dim:          #52525e;
  --accent:            #ffab1f;
  --accent-beat:       #ff4b4b;
  --on-accent:         #1a1000;
  --accent-glow:       color-mix(in srgb, var(--accent) 55%, transparent);
  --dot-idle:          #2e2e38;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        30ms;
  --dot-decay:         340ms;
  --dot-ease:          cubic-bezier(0.15, 0.75, 0.3, 1);
  --content-max-width: 500px;
  --content-max-width-wide: 1100px;
  --radius:            6px;
  --radius-panel:      14px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-mono);

  /* theme-private */
  --chassis: #121217;
  --screen:  #050508;
  --raised:  #1a1a20;
  --key-top: #25252d;
  --sunken:  #0b0b0f;
  --beat-glow: color-mix(in srgb, var(--accent-beat) 55%, transparent);
  --bevel:  inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --recess: inset 0 2px 6px rgba(0, 0, 0, 0.75);
  --lift:   0 10px 26px rgba(0, 0, 0, 0.55);

  /* .step-btn:hover / .quick-select-toggle:hover / .quick-select-option:hover
     (@layer components) read the shared --neutral-850 primitive directly for
     their hover surface — see Global Constraints. Overriding it here, rather
     than editing those locked component rules, is how this theme gets its
     own hover surface. */
  --neutral-850: #25252d;
}

:root[data-theme="pulse-engine"] body {
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #14141b 0%, transparent 60%),
    var(--bg);
}

:root[data-theme="pulse-engine"] h1 {
  font-size: 0.9375rem;
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text);
  padding-bottom: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
}

:root[data-theme="pulse-engine"] #topbar {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-xs) var(--space-md);
  align-items: end;
  padding: var(--space-xs) var(--space-sm) var(--space-sm);
  margin-bottom: var(--space-sm);
  background: var(--chassis);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] #tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin-bottom: var(--space-lg);
  background: var(--sunken);
  border: 1px solid var(--divider);
  border-radius: 10px;
  box-shadow: var(--recess);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .tab-btn {
  flex: 1;
  background: none;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  padding: 0.6rem 0.25rem;
}

:root[data-theme="pulse-engine"] .tab-btn:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

:root[data-theme="pulse-engine"] .tab-btn:active { transform: translateY(1px); }

:root[data-theme="pulse-engine"] .tab-btn.active {
  color: var(--accent);
  background: var(--raised);
  border-color: var(--overlay);
  box-shadow: var(--bevel), 0 2px 5px rgba(0, 0, 0, 0.5);
}

:root[data-theme="pulse-engine"] .hero-frame {
  isolation: isolate;
  padding: var(--space-sm);
  background: linear-gradient(180deg, #20202a 0%, var(--chassis) 55%);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel), var(--lift);
}

:root[data-theme="pulse-engine"] .hero-readout {
  position: relative;
  overflow: hidden;
  padding: var(--space-md) var(--space-sm) var(--space-xs);
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 9px;
  box-shadow: var(--recess), inset 0 0 40px -12px var(--accent-glow);
  text-align: center;
}

:root[data-theme="pulse-engine"] .hero-readout::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.022) 0 1px,
    transparent 1px 3px
  );
}

:root[data-theme="pulse-engine"] #beatFlash {
  z-index: 2;
  border-radius: var(--radius-panel);
  box-shadow: inset 0 0 0 1px var(--accent), inset 0 0 26px -8px var(--accent);
}

:root[data-theme="pulse-engine"] #beatFlash.beat { animation: pulse-engine-shell-strike 240ms ease-out; }

:root[data-theme="pulse-engine"] #beatFlash.beat.beat-accent {
  animation-duration: 400ms;
  box-shadow: inset 0 0 0 2px var(--accent-beat), inset 0 0 34px -8px var(--accent-beat);
}

:root[data-theme="pulse-engine"] #heroBpm {
  font-size: clamp(3.75rem, 17vw, 5.5rem);
  text-shadow: 0 0 26px var(--accent-glow);
}

:root[data-theme="pulse-engine"] #heroBpmLabel {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.35em;
  text-indent: 0.35em;
  color: color-mix(in srgb, var(--accent) 55%, var(--text-dim));
  margin-top: 0.4rem;
}

:root[data-theme="pulse-engine"] .hero-frame #beatIndicator {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  align-content: flex-end;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  margin-top: var(--space-sm);
  padding: var(--space-2xs) var(--space-xs);
  background: var(--sunken);
  border: 1px solid #000;
  border-radius: 9px;
  box-shadow: var(--recess);
}

:root[data-theme="pulse-engine"] .beat-dot {
  width: 20px;
  height: 42px;
  border: none;
  border-radius: 2px;
  transform-origin: bottom center;
  box-shadow: var(--bevel);
}

:root[data-theme="pulse-engine"] .beat-dot.pulse {
  box-shadow: 0 0 20px -2px var(--accent-glow), var(--bevel);
  transform: scaleY(1.1);
}

:root[data-theme="pulse-engine"] .beat-dot.pulse.accent {
  box-shadow: 0 0 24px -2px var(--beat-glow), var(--bevel);
  transform: scaleY(1.2);
}

:root[data-theme="pulse-engine"] .readout {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  min-height: 1.4em;
  margin-top: var(--space-sm);
}

:root[data-theme="pulse-engine"] .phase-segment {
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  color: var(--text-dim);
  transition: color var(--duration-fast) var(--ease-standard),
              background-color var(--duration-fast) var(--ease-standard),
              border-color var(--duration-fast) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .phase-segment.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: var(--font-weight-bold);
}

:root[data-theme="pulse-engine"] .panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  padding: var(--space-sm);
  margin-bottom: var(--space-md);
  background: var(--chassis);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .panel[hidden] { display: none; }

:root[data-theme="pulse-engine"] body.playing #topbar,
:root[data-theme="pulse-engine"] body.playing #tabs,
:root[data-theme="pulse-engine"] body.playing .panel {
  filter: grayscale(0.9);
  opacity: 0.82;
}

:root[data-theme="pulse-engine"] body.playing #topbar:hover,
:root[data-theme="pulse-engine"] body.playing #tabs:hover,
:root[data-theme="pulse-engine"] body.playing .panel:hover,
:root[data-theme="pulse-engine"] body.playing #topbar:focus-within,
:root[data-theme="pulse-engine"] body.playing #tabs:focus-within,
:root[data-theme="pulse-engine"] body.playing .panel:focus-within {
  filter: none;
  opacity: 1;
}

:root[data-theme="pulse-engine"] label,
:root[data-theme="pulse-engine"] .field-group {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
}

/* Only the Volume row's label has a nested <span> (for the "80%" readout);
   every other label is plain text, so this stays scoped to that one row.
   Classic deliberately has no equivalent rule and keeps "Volume 80%" inline. */
:root[data-theme="pulse-engine"] label > span {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2xs);
}

:root[data-theme="pulse-engine"] #volumeValue {
  font-family: var(--font-mono);
  color: var(--text);
}

:root[data-theme="pulse-engine"] input[type="number"],
:root[data-theme="pulse-engine"] select {
  background: var(--screen);
  border: 1px solid #000;
  padding: 0.5rem 0.55rem;

/* The circle's size comes from width/height, so the shared rule's
   `padding: var(--space-sm) var(--space-3xl)` has to go: 48px of side padding
   against a 108px border-box leaves a 10px content box, and the label was
   laid out from that box's left edge, landing ~17px right of centre. Flex
   centring rather than relying on the button's default text centring, because
   that is what stays correct if the label ever wraps or gains an icon.
   text-indent is half of --tracking-wider, offsetting the trailing
   letter-space the tracking adds after the final character: the glyph run is
   centred including that space, so the letters you actually see sit half a
   letter-space left of true centre. */
:root[data-theme="pulse-engine"] #startStop {
  position: relative;
  width: 108px;
  height: 108px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-indent: calc(var(--tracking-wider) / 2);
  border-radius: var(--radius-round);
  background: var(--accent);
  color: var(--on-accent);
  border: 1px solid rgba(0, 0, 0, 0.5);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35),
              inset 0 -3px 8px rgba(0, 0, 0, 0.25),
              0 8px 22px rgba(0, 0, 0, 0.5),
              0 0 34px -10px var(--accent-glow);
  transition: background-color var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-fast) var(--ease-standard),
              filter var(--duration-fast) var(--ease-standard),
              transform var(--duration-instant) var(--ease-standard);
}

:root[data-theme="pulse-engine"] #startStop:hover { filter: brightness(1.06); }

:root[data-theme="pulse-engine"] #startStop:active {
  transform: translateY(2px) scale(0.98);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4), 0 3px 10px rgba(0, 0, 0, 0.5);
}

:root[data-theme="pulse-engine"] #startStop.is-playing {
  background: var(--accent-beat);
  color: #fff;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3),
              inset 0 -3px 8px rgba(0, 0, 0, 0.3),
              0 8px 22px rgba(0, 0, 0, 0.5),
              0 0 38px -10px var(--beat-glow);
}

:root[data-theme="pulse-engine"] #startStop.is-playing::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: var(--radius-round);
  border: 1px solid var(--accent-beat);
  opacity: 0.45;
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  :root[data-theme="pulse-engine"] #startStop.is-playing::after {
    animation: pulse-engine-transport-ring 1.8s ease-in-out infinite;
  }
}

     than editing those locked component rules, is how the popup option gets
